ue combina com a sua base.&lt;/b&gt;&lt;/p&gt;&lt;p class=&quot;lead&quot;&gt;Do profissional de qualquer área que quer automatizar o trabalho sem programar ao desenvolvedor que leva agentes à produção. Cada MBA diz com clareza o preparo que pede, para você não escolher um nível acima nem abaixo da sua base. Todas as aulas são ao vivo.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:16px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#comparador&quot;&gt;Comparar os MBAs Live&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 5;height:420px;border-radius:10px&quot;&gt;[IMAGEM · profissional diante de um fluxo de automação ou agente de IA durante a aula ao vivo · evitar robôs e telas genéricas de banco de imagens]&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:20px&quot;&gt;Os MBAs Live desta área&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#55534D&quot;&gt;3 formações · 3 caminhos · todas com duração de 1 ano&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);column-gap:32px;row-gap:12px;grid-template-rows:auto 1fr&quot;&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 1 · Aplicar IA sem programar&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para profissionais de qualquer área com ensino superior&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Inteligência Artificial e Automação de Processos&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Crie automações e agentes inteligentes no seu trabalho, sem programar.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-inteligencia-artificial-e-automacao-de-processos-curso-de-ia/&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 2 · Construir modelos e sistemas de IA&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para quem programa em Python e quer ir além da modelagem&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia de IA, Machine Learning e Deep Learning&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Do treinamento e ajuste de modelos à construção de agentes e sistemas cognitivos.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-graduacao-machine-learning-deep-learning-curso-deep-learning&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 3 · Levar agentes, RAG e MCP à produção&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para devs com experiência que querem levar agentes à produção&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia de Contexto e Agentes de IA: RAG, MCP e Multiagentes&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Construa agentes e sistemas multiagentes que funcionam em produção.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/curso-agentes-de-ia-context-engineering-mcp-rag&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;num&quot;&gt;&lt;div&gt;&lt;b&gt;30 anos&lt;/b&gt;&lt;span&gt;especializada em tecnologia, desde 1994&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Live desde 2014&lt;/b&gt;&lt;span&gt;100% das aulas ao vivo&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;30 mil+&lt;/b&gt;&lt;span&gt;alunos formados em todo o Brasil&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Nota máxima (5)&lt;/b&gt;&lt;span&gt;no credenciamento EAD do MEC&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;section id=&quot;como&quot;&gt;&lt;div class=&quot;tag&quot;&gt;02 · Como funciona o MBA Live&lt;/div&gt;&lt;h2 style=&quot;max-width:760px&quot;&gt;Aula ao vivo de verdade, não videoaula gravada anos atrás&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;max-width:800px;font-size:18px&quot;&gt;Você faz parte de uma turma real e fala em tempo real com o professor. Uma área que muda o tempo todo: dúvida resolvida na hora com o professor e a turma, em aula ao vivo.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 7;height:460px;border-radius:10px;flex-direction:column;gap:6px&quot;&gt;&lt;span style=&quot;font-size:14px&quot;&gt;[VÍDEO · TRECHO REAL DE AULA · 60–90s]&lt;/span&gt;&lt;span style=&quot;font-size:11px&quot;&gt;usar o vídeo da página &quot;Como funciona&quot; ou gravar um trecho de aula de um dos MBAs&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 5;display:grid;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Dias e horário&lt;/div&gt;&lt;div style=&quot;font-size:20px;font-weight:700&quot;&gt;Seg e Qua ou Ter e Qui · 20h às 22h&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;64 aulas ao vivo em 1 ano, com calendário entregue no início&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Interação em tempo real&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Aulas pelo Zoom integradas ao Infnet Online. Travou no código? A dúvida é resolvida durante a aula.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Prática com desafios reais&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Labs virtuais e 8 projetos com desafios reais, um por disciplina.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Perdeu uma aula?&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;As gravações ficam no Infnet Online para você rever quantas vezes quiser.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;carreiras&quot;&gt;&lt;div class=&quot;tag&quot;&gt;03 · A área e as carreiras&lt;/div&gt;&lt;h2&gt;O que faz quem trabalha com IA, agentes e automação&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;IA no trabalho pode significar três coisas diferentes: usar a IA para automatizar processos e tarefas, construir e operar modelos e sistemas de IA, ou projetar o contexto, os dados e as ferramentas que fazem agentes funcionarem em produção. O preparo exigido muda muito: de &amp;#x27;sem programar&amp;#x27; a &amp;#x27;experiência em desenvolvimento&amp;#x27;. As empresas procuram quem transforma IA em um sistema que funciona, gera resultado e é seguro, não só quem experimenta ferramentas.&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Cargos&lt;/div&gt;&lt;ul style=&quot;margin:0;padding-left:20px;line-height:1.7&quot;&gt;&lt;li&gt;Engenheiro(a) de IA (AI Engineer) · Engenheiro(a) de Machine Learning · Engenheiro(a) de MLOps&lt;/li&gt;&lt;li&gt;Engenheiro(a) de Agentes de IA · Engenheiro(a) de LLM/RAG&lt;/li&gt;&lt;li&gt;Engenheiro(a) de Aplicações de IA · Arquiteto(a) de Soluções de IA · Tech Lead de IA Aplicada&lt;/li&gt;&lt;li&gt;Especialista em IA Generativa / LLM Engineer · Cientista de Dados Sênior&lt;/li&gt;&lt;li&gt;Aplicação prática de IA na própria profissão&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Tecnologias e práticas&lt;/div&gt;&lt;span class=&quot;chip&quot;&gt;n8n&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Power Automate&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Prompt engineering&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;ChatGPT Work · Claude&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Scikit-learn · MLOps&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;LLMs · RAG&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Hugging Face&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;LangChain&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;LangGraph&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;MCP&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;OpenAI Agents SDK&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;pgvector&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;color:#9fb4ff;margin-bottom:12px&quot;&gt;Três níveis de preparo&lt;/div&gt;&lt;p style=&quot;line-height:1.55&quot;&gt;IA e Automação pede só ensino superior, sem programar. Engenharia de IA pede Python, estatística básica e lógica de programação. Contexto e Agentes pede experiência em desenvolvimento, Python, APIs e bancos de dados. Escolha pela sua base.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;caminho&quot;&gt;&lt;div class=&quot;tag&quot;&gt;04 · Qual caminho é para você? (interativo)&lt;/div&gt;&lt;h2&gt;Qual caminho é para você?&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Escolha o que mais parece com o seu momento.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div style=&quot;grid-column:span 5&quot;&gt;&lt;button class=&quot;opt on&quot; data-i=&quot;0&quot;&gt;&lt;b&gt;Sou de qualquer área&lt;/b&gt;&lt;span&gt;Quero automatizar sem programar&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;1&quot;&gt;&lt;b&gt;Programo em Python&lt;/b&gt;&lt;span&gt;Quero treinar modelos e criar agentes&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;2&quot;&gt;&lt;b&gt;Sou desenvolvedor&lt;/b&gt;&lt;span&gt;Quero levar agentes à produção&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;3&quot;&gt;&lt;b&gt;Quero entender a área&lt;/b&gt;&lt;span&gt;Antes de decidir&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 7&quot;&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;0&quot; style=&quot;padding:32px;display:block&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;IA e Automação de Processos&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Crie automações e agentes inteligentes no seu trabalho: workflows com n8n e Power Automate, prompt engineering e assistentes autônomos. Pede só ensino superior completo.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;n8n · Power Automate · prompt engineering · Seg e Qua&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Programa em Python? Veja Engenharia de IA.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;1&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Engenharia de IA, Machine Learning e Deep Learning&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Do treinamento e ajuste de modelos à construção de agentes e sistemas cognitivos: ML, Deep Learning e MLOps, com LLMs, RAG, embeddings, Hugging Face, LangChain e LangGraph.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: Python, noções de estatística e lógica de programação · Seg e Qua&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Já desenvolve e quer agentes em produção? Veja Contexto e Agentes.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;2&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Engenharia de Contexto e Agentes de IA: RAG, MCP e Multiagentes&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Construa agentes e sistemas multiagentes que funcionam em produção: engenharia de contexto, RAG com bancos vetoriais, servidores MCP e orquestração com LangGraph.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: experiência em desenvolvimento, Python, APIs e bancos de dados · Ter e Qui&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;3&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Converse com um consultor&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Um consultor ajuda você a entender qual aplicação de IA faz sentido para o seu momento de carreira e qual MBA combina com a sua base.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Os três MBAs duram 1 ano e têm aulas das 20h às 22h&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;comparador&quot;&gt;&lt;div class=&quot;tag&quot;&gt;05 · Comparador&lt;/div&gt;&lt;h2&gt;Compare os 3 MBAs Live lado a lado&lt;/h2&gt;&lt;div class=&quot;band&quot;&gt;&lt;span&gt;Em todos os 3: 1 ano&lt;/span&gt;&lt;span&gt;20h às 22h (aulas ao vivo)&lt;/span&gt;&lt;span&gt;64 aulas ao vivo · 8 projetos com desafios reais&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cmp&quot; style=&quot;grid-template-columns:170px repeat(3,1fr)&quot;&gt;&lt;div style=&quot;background:#1E1E1C;border-right:1px solid #3A3935&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#1E1E1C;color:#FFFFFF;line-height:1.4;border-right:1px solid #3A3935&quot;&gt;MBA em Engenharia de IA, Machine Learning e Deep Learning&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#1E1E1C;color:#FFFFFF;line-height:1.4;border-right:1px solid #3A3935&quot;&gt;MBA em Inteligência Artificial e Automação de Processos&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#1E1E1C;color:#FFFFFF;line-height:1.4;border-right:1px solid #3A3935&quot;&gt;MBA em Engenharia de Contexto e Agentes de IA: RAG, MCP e Multiagentes&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Se você quer&lt;/div&gt;&lt;div&gt;Treinar modelos e criar agentes de IA em produção&lt;/div&gt;&lt;div&gt;Automatizar processos e criar agentes de IA sem programar&lt;/div&gt;&lt;div&gt;Levar agentes, RAG e MCP à produção&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Para quem é&lt;/div&gt;&lt;div&gt;Desenvolvedores e engenheiros de dados que querem construir IA em produção&lt;/div&gt;&lt;div&gt;Profissionais de qualquer área que querem aplicar IA sem programar&lt;/div&gt;&lt;div&gt;Desenvolvedores, engenheiros e arquitetos que querem agentes em produção&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Pré-requisitos&lt;/div&gt;&lt;div&gt;Python (incluindo manipulação de dados), noções de estatística e lógica de programação; inglês técnico para leitura recomendado&lt;/div&gt;&lt;div&gt;Ensino superior completo no momento da matrícula; aberto a profissionais de qualquer área, sem exigir programação&lt;/div&gt;&lt;div&gt;Conhecimento prático em desenvolvimento de software, domínio de Python e familiaridade com APIs e bancos de dados; experiência com APIs de LLMs ajuda, mas não é obrigatória; inglês técnico de leitura recomendado; não é preciso conhecimento prévio em machine learning&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Principais tecnologias&lt;/div&gt;&lt;div&gt;Scikit-learn · MLOps · PLN · LLMs · redes neurais profundas · visão computacional · Hugging Face · LangChain · LangGraph&lt;/div&gt;&lt;div&gt;n8n · Power Automate · IA no Excel · prompt engineering · assistentes autônomos · ChatGPT Work · Claude (agentes e skills)&lt;/div&gt;&lt;div&gt;Engenharia de contexto · RAG · pgvector · MCP · OpenAI Agents SDK · LangGraph&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Cargo-alvo&lt;/div&gt;&lt;div&gt;Engenheiro(a) de IA (AI Engineer); Engenheiro(a) de Machine Learning; Engenheiro(a) de MLOps; Especialista em IA Generativa / LLM Engineer; Cientista de Dados Sênior&lt;/div&gt;&lt;div&gt;Aplicação prática de IA na sua profissão (marketing, gestão, comunicação, design, direito ou engenharia); Atuação em IA e automação, com soluções e projetos inovadores&lt;/div&gt;&lt;div&gt;Engenheiro(a) de Agentes de IA (Agentic AI Engineer); Engenheiro(a) de LLM/RAG; Engenheiro(a) de Aplicações de IA (Applied AI Engineer); Arquiteto(a) de Soluções de IA; Tech Lead de IA Aplicada; Engenheiro(a) de IA (AI Engineer)&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Dias das aulas&lt;/div&gt;&lt;div&gt;Seg e Qua, 20h00 às 22h00&lt;/div&gt;&lt;div&gt;Seg e Qua, 20h00 às 22h00&lt;/div&gt;&lt;div&gt;Ter e Qui, 20h00 às 22h00&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-graduacao-machine-learning-deep-learning-curso-deep-learning&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-inteligencia-artificial-e-automacao-de-processos-curso-de-ia/&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/curso-agentes-de-ia-context-engineering-mcp-rag&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;live&quot;&gt;&lt;div class=&quot;tag&quot;&gt;06 · MBA Live x EAD gravado&lt;/div&gt;&lt;h2&gt;Por que um MBA ao vivo, e não gravado&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;color:#55534D;margin-bottom:10px&quot;&gt;EAD gravado&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;color:#55534D&quot;&gt;Videoaula pronta, gravada há anos&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Travou no código? Pergunta no fórum e espera&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Prova online ou TCC no final do curso&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Estudo sozinho, sem turma&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;margin-bottom:10px&quot;&gt;MBA Live Infnet&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;&quot;&gt;64 aulas 100% ao vivo, com grade atualizada pelo mercado&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Dúvida de código resolvida na hora com o professor&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;8 projetos com desafios reais, um por disciplina&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Turma, comunidade online e Central de Carreiras com convênio com mais de 675 empresas&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;prova&quot;&gt;&lt;div class=&quot;tag&quot;&gt;07 · Prova de valor&lt;/div&gt;&lt;h2&gt;Quem ensina e quem já passou por aqui&lt;/h2&gt;&lt;h3 style=&quot;margin-top:16px&quot;&gt;Coordenação com quem atua em inteligência artificial, agentes e automação no mercado&lt;/h3&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(2,1fr);gap:24px&quot;&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Fernando Ferreira&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Doutor em Engenharia Elétrica (COPPE/UFRJ) · cofundador da Twist Systems · 15+ anos em IA&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Engenharia de IA, Machine Learning e Deep Learning; Inteligência Artificial e Automação de Processos; Engenharia de Contexto e Agentes de IA: RAG, MCP e Multiagentes&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;border:1px dashed #8A877F;border-radius:10px;padding:24px;display:flex;flex-direction:column;justify-content:center&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:18px;line-height:1.35&quot;&gt;Professores que atuam em grandes empresas, como Microsoft, Globo, Itaú e Vivo&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:10px&quot;&gt;Quadro permanente do Infnet e especialistas convidados por disciplina&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:8px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px&quot;&gt;&lt;h3 style=&quot;font-size:22px;margin-bottom:6px&quot;&gt;8 projetos por MBA, com desafios reais&lt;/h3&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-bottom:6px&quot;&gt;Sugestões de projeto a partir da matriz curricular de cada MBA. São apenas ideias ilustrativas.&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;&lt;span class=&quot;tag&quot; style=&quot;font-size:11px&quot;&gt;Sugestão de projeto · IA e Automação&lt;/span&gt;&lt;br&gt;fluxo que automatiza um processo da sua área, como a triagem de solicitações, com n8n e Power Automate, apoiado por um assistente de IA com Claude ou ChatGPT.&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;&lt;span class=&quot;tag&quot; style=&quot;font-size:11px&quot;&gt;Sugestão de projeto · Engenharia de IA&lt;/span&gt;&lt;br&gt;modelo de classificação com Scikit-learn levado à produção com MLOps e um agente com LangChain que usa LLMs para responder sobre os dados.&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;&lt;span class=&quot;tag&quot; style=&quot;font-size:11px&quot;&gt;Sugestão de projeto · Contexto e Agentes&lt;/span&gt;&lt;br&gt;agente com RAG em pgvector, ferramentas expostas via MCP e orquestração multiagente com LangGraph, com guardrails e persistência de estado.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;O programa de pós-graduação em IA Generativa no Infnet foi enriquecedor. Permitiu a abertura de novas oportunidades para minha carreira.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;Janine Monteiro&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Engenharia de IA, Machine Learning e Deep Learning&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;A formação no MBA em Engenharia de IA do Infnet me proporcionou um riquíssimo aprendizado, elevando meu conhecimento a um nível que eu sempre almejei.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;Cristiano de Macedo&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Engenharia de IA, Machine Learning e Deep Learning&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;relacionados&quot;&gt;&lt;div class=&quot;tag&quot;&gt;08 · Caminhos relacionados&lt;/div&gt;&lt;h2&gt;IA também se conecta a dados e software&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB DADOS&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Ciência de Dados, Engenharia de Dados e Banco de Dados&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer analisar, construir pipelines ou sustentar bancos de dados →&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB ENGENHARIA DE SOFTWARE&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Engenharia de Software&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer aprofundar uma stack, conduzir agentes de IA ou chegar à arquitetura →&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;consultor&quot;&gt;&lt;div class=&quot;tag&quot;&gt;09 · Dúvidas e fale com um consultor&lt;/div&gt;&lt;div&gt;&lt;h2 style=&quot;margin-bottom:24px&quot;&gt;Dúvidas de quem está comparando&lt;/h2&gt;&lt;details open&gt;&lt;summary&gt;As aulas são ao vivo?&lt;/summary&gt;&lt;p&gt;Segundo o documento de diferenciais do Infnet, todas as aulas são 100% ao vivo, síncronas, com data e hora para acontecer; não é um modelo híbrido nem &amp;#x27;a maioria das aulas&amp;#x27;.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Preciso saber programar?&lt;/summary&gt;&lt;p&gt;Depende do caminho. O MBA em IA e Automação de Processos pede apenas ensino superior completo e não exige programação. Engenharia de IA pede Python, estatística básica e lógica de programação. Engenharia de Contexto e Agentes pede experiência em desenvolvimento, Python, APIs e bancos de dados.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual a diferença entre os MBAs de IA?&lt;/summary&gt;&lt;p&gt;IA e Automação de Processos aplica a IA ao trabalho, sem programar: n8n, Power Automate, IA no Excel, prompt engineering, assistentes autônomos e agentes com ChatGPT Work e Claude. Engenharia de IA, ML e Deep Learning treina modelos e constrói agentes: Machine Learning com Scikit-Learn, MLOps, PLN, LLMs, redes neurais, visão computacional, LangChain e LangGraph. Engenharia de Contexto e Agentes foca em contexto, RAG e bancos vetoriais, MCP, memória de agentes, OpenAI Agents SDK e sistemas multiagentes com LangGraph.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Posso fazer se não sou da área de tecnologia?&lt;/summary&gt;&lt;p&gt;O MBA em IA e Automação de Processos é aberto a profissionais de qualquer área com ensino superior completo, sem exigir programação. Os outros dois pedem base técnica.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;O diploma é reconhecido pelo MEC?&lt;/summary&gt;&lt;p&gt;Sim. O Infnet tem nota máxima (5) no credenciamento do MEC para o ensino a distância. O diploma do MBA Live tem a mesma validade e o mesmo reconhecimento do diploma de um MBA presencial em todo o Brasil; é uma formação lato sensu, de especialista .&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Quais são as formas de pagamento?&lt;/summary&gt;&lt;p&gt;Valores e condições são apresentados pelos consultores ou no atendimento inteligente; não aparecem no Hub [regra do projeto: preço fica na LP e com o consultor].&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;div style=&quot;border:2px dashed #1f3fae;border-radius:12px;padding:12px 12px 32px;background:#F2F1EC&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;padding:4px 12px 14px&quot;&gt;[Espaço reservado · incluir aqui o bot de CTA · o formulário abaixo é a referência do que o bot deve coletar]&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;max-width:640px;margin:0 auto;padding:32px&quot;&gt;&lt;h2 style=&quot;font-size:28px;margin-bottom:8px&quot;&gt;Não sabe qual caminho em IA combina com sua base? Converse com um consultor e veja como é a aula ao vivo.&lt;/h2&gt;&lt;p style=&quot;color:#55534D;margin-bottom:20px&quot;&gt;Conte seu momento de carreira e a base que você já tem. O consultor indica o caminho mais adequado.&lt;/p&gt;&lt;label&gt;Nome&lt;/label&gt;&lt;input placeholder=&quot;Seu nome&quot;&gt;&lt;label&gt;E-mail&lt;/label&gt;&lt;input placeholder=&quot;seu@email.com&quot;&gt;&lt;label&gt;WhatsApp&lt;/label&gt;&lt;input placeholder=&quot;(00) 00000-0000&quot;&gt;&lt;label&gt;Interesse&lt;/label&gt;&lt;select&gt;&lt;option&gt;Selecione o MBA&lt;/option&gt;&lt;option&gt;MBA em Engenharia de IA, Machine Learning e Deep Learning&lt;/option&gt;&lt;option&gt;MBA em Inteligência Artificial e Automação de Processos&lt;/option&gt;&lt;option&gt;MBA em Engenharia de Contexto e Agentes de IA: RAG, MCP e Multiagentes&lt;/option&gt;&lt;option&gt;Ainda não sei&lt;/option&gt;&lt;/select&gt;&lt;button class=&quot;btn dark&quot; style=&quot;width:100%;justify-content:center&quot;&gt;Quero falar com um consultor&lt;/button&gt;&lt;p style=&quot;font-size:13px;color:#55534D;margin-top:12px&quot;&gt;Atendimento inteligente pela Íris, a qualquer hora; depois, um consultor entra em contato. &lt;span class=&quot;todo&quot;&gt;[Conteúdo a criar: texto de privacidade e LGPD, a definir com o jurídico]&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;footer&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px;background-color:#333;color:#aaa&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;div style=&quot;display:flex;gap:28px&quot;&gt;&lt;span&gt;Política de privacidade&lt;/span&gt;&lt;span&gt;Faculdade Infnet&lt;/span&gt;&lt;span&gt;Contato&lt;/span&gt;&lt;/div&gt;&lt;/footer&gt;&lt;/div&gt;&lt;script&gt;document.querySelectorAll(&quot;.opt&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){var i=b.dataset.i;document.querySelectorAll(&quot;.opt&quot;).forEach(function(x){x.classList.toggle(&quot;on&quot;,x===b)});document.querySelectorAll(&quot;.rec&quot;).forEach(function(c){c.style.display=c.dataset.i===i?&quot;block&quot;:&quot;none&quot;})})})&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section><section class="hub" id="H04"><iframe title="H04" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;pt-BR&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=1440&quot;&gt;&lt;title&gt;Ciência de Dados, Engenharia de Dados e Banco de Dados | Faculdade Infnet&lt;/title&gt;&lt;link href=&quot;https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;details class=&quot;prod&quot;&gt;&lt;summary&gt;Notas de produção deste Hub&lt;/summary&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;SEO:&lt;/b&gt; title: Ciência de Dados, Engenharia de Dados e Banco de Dados | Faculdade Infnet · meta: Compare os MBAs em Data Science, Engenharia de Dados e Banco de Dados da Faculdade Infnet. Aulas 100% ao vivo. · URL: /ead/hubs/dados-ciencia-engenharia-e-banco-de-dados/ [validar no Webflow] · keywords: ciência de dados; engenharia de dados; pós-graduação ciência de dados; mba big data; pós-graduação em banco de dados&lt;/li&gt;&lt;li&gt;Mapa revisado: este Hub unifica os antigos H04 (Ciência de Dados e Analytics) e H05 (Engenharia e Banco de Dados). O ID H05 deixou de existir.&lt;/li&gt;&lt;li&gt;&amp;#x27;formação em dados&amp;#x27; é keyword ambígua: enviar a este Hub só após revisão de consultas. Keywords de BI e Analytics migradas da origem: revisar antes de ativar.&lt;/li&gt;&lt;li&gt;Formato do wireframe antigo (9 blocos). Em amarelo: [confirmar] ou [Conteúdo a criar]. Placeholders hachurados: imagens, ícones e fotos a cargo da equipe de criação. Preço fora do Hub.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;div class=&quot;page&quot;&gt;&lt;header&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;nav&gt;&lt;span&gt;Como funciona&lt;/span&gt;&lt;span&gt;Carreiras&lt;/span&gt;&lt;span&gt;Comparar MBAs&lt;/span&gt;&lt;span&gt;Professores e alunos&lt;/span&gt;&lt;span&gt;Dúvidas&lt;/span&gt;&lt;/nav&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/header&gt;&lt;section id=&quot;topo&quot;&gt;&lt;div class=&quot;grid12&quot;&gt;&lt;div style=&quot;grid-column:span 7;display:flex;flex-direction:column;gap:24px&quot;&gt;&lt;span class=&quot;tag&quot;&gt;MBA Live ● Faculdade Infnet, referência em tecnologia há 30 anos.&lt;/span&gt;&lt;h1&gt;MBAs em Ciência de Dados, Engenharia de Dados e Banco de Dados&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;&lt;b&gt;A IA depende de dados organizados e confiáveis. Escolha onde você entra: analisar, construir pipelines ou sustentar bancos de dados.&lt;/b&gt;&lt;/p&gt;&lt;p class=&quot;lead&quot;&gt;Ciência de dados, engenharia de dados e banco de dados são carreiras diferentes dentro do mesmo universo. Compare três MBAs Live e escolha pela sua base e pelo que quer fazer com dados. Se você vem de negócios, marketing ou finanças, o MBA em Data Science aceita quem quer migrar para dados, mesmo sem domínio técnico prévio. Todas as aulas são ao vivo.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:16px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#comparador&quot;&gt;Comparar os MBAs Live&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 5;height:420px;border-radius:10px&quot;&gt;[IMAGEM · analista diante de um painel de dados durante a aula ao vivo · evitar gráficos genéricos de banco de imagens]&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:20px&quot;&gt;Os MBAs Live desta área&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#55534D&quot;&gt;3 formações · 2 caminhos · todas com duração de 1 ano&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(2,1fr);column-gap:32px;row-gap:12px;grid-template-rows:auto 1fr&quot;&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 1 · Analisar e modelar dados&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para quem trabalha com dados ou quer migrar para a área&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Data Science com IA&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Transforme dados em análises confiáveis e decisões estratégicas.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-em-ciencia-de-dados-mba-data-science/&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 2 · Construir e sustentar plataformas de dados&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para profissionais de TI, DBAs e desenvolvedores SQL&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;display:flex;gap:18px;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:64px;height:64px;flex:none;border-radius:8px;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia de Dados: Big Data e IA&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Projete e opere plataformas de Big Data escaláveis e integradas com IA.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-graduacao-em-engenharia-de-dados-big-data/&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;display:flex;gap:18px;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:64px;height:64px;flex:none;border-radius:8px;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia de Banco de Dados e Data Warehouse com IA&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Projete, integre e sustente plataformas de dados de ponta a ponta, do banco transacional ao Data Warehouse e ao BI.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-em-banco-de-dados-oracle-sql-server/&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;num&quot;&gt;&lt;div&gt;&lt;b&gt;30 anos&lt;/b&gt;&lt;span&gt;especializada em tecnologia, desde 1994&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Live desde 2014&lt;/b&gt;&lt;span&gt;100% das aulas ao vivo&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;30 mil+&lt;/b&gt;&lt;span&gt;alunos formados em todo o Brasil&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Nota máxima (5)&lt;/b&gt;&lt;span&gt;no credenciamento EAD do MEC&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;section id=&quot;como&quot;&gt;&lt;div class=&quot;tag&quot;&gt;02 · Como funciona o MBA Live&lt;/div&gt;&lt;h2 style=&quot;max-width:760px&quot;&gt;Aula ao vivo de verdade, não videoaula gravada anos atrás&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;max-width:800px;font-size:18px&quot;&gt;Você faz parte de uma turma real e fala em tempo real com o professor. Dúvida de código, SQL, estatística, modelagem e arquitetura de dados resolvida na hora, em aula ao vivo.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 7;height:460px;border-radius:10px;flex-direction:column;gap:6px&quot;&gt;&lt;span style=&quot;font-size:14px&quot;&gt;[VÍDEO · TRECHO REAL DE AULA · 60–90s]&lt;/span&gt;&lt;span style=&quot;font-size:11px&quot;&gt;usar o vídeo da página &quot;Como funciona&quot; ou gravar um trecho de aula de um dos MBAs&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 5;display:grid;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Dias e horário&lt;/div&gt;&lt;div style=&quot;font-size:20px;font-weight:700&quot;&gt;Seg e Qua ou Ter e Qui · 20h às 22h&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;64 aulas ao vivo em 1 ano, com calendário entregue no início&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Interação em tempo real&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Aulas pelo Zoom integradas ao Infnet Online. Travou no código? A dúvida é resolvida durante a aula.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Prática com desafios reais&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Labs virtuais e 8 projetos com desafios reais, um por disciplina.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Perdeu uma aula?&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;As gravações ficam no Infnet Online para você rever quantas vezes quiser.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;carreiras&quot;&gt;&lt;div class=&quot;tag&quot;&gt;03 · A área e as carreiras&lt;/div&gt;&lt;h2&gt;O que faz quem trabalha com dados&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Trabalhar com dados tem três carreiras: analisar e modelar dados para apoiar decisões (ciência de dados e analytics), construir pipelines e plataformas distribuídas de Big Data (engenharia de dados) e modelar, sustentar e integrar bancos de dados e data warehouses (banco de dados). Os MBAs aprofundam cada uma delas, com Power BI, R, KNIME e SQL na análise; SQL avançado, dbt, Spark SQL, Delta Lake e Kafka nos pipelines; SQL Server 2025, Azure SQL, Oracle 26ai, MongoDB e BigQuery nos bancos e no warehouse. Relatórios e consultas simples já podem ser feitos com IA; ganha valor quem interpreta os dados, recomenda e constrói a base confiável para a IA funcionar.&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Cargos&lt;/div&gt;&lt;ul style=&quot;margin:0;padding-left:20px;line-height:1.7&quot;&gt;&lt;li&gt;Cientista de Dados · Analista de Modelagem Preditiva&lt;/li&gt;&lt;li&gt;Analista de Dados Sênior (Data Analyst) · Analista de BI e Analytics · Analytics Engineer&lt;/li&gt;&lt;li&gt;Data Engineer · Senior Data Engineer · Data Platform Engineer · MLOps Engineer / ML Platform Engineer&lt;/li&gt;&lt;li&gt;Database Engineer / DBA moderno (com foco em cloud, performance e alta disponibilidade)&lt;/li&gt;&lt;li&gt;Data Architect / Data Platform Architect&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Tecnologias e práticas&lt;/div&gt;&lt;span class=&quot;chip&quot;&gt;Power BI&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;R&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;KNIME&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;SQL&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Estatística&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;dbt&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Spark SQL · Databricks&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Delta Lake · Lakehouse&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Kafka&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;AWS Glue&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;SQL Server 2025 · Azure SQL&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Oracle 26ai&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;MongoDB&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;BigQuery&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;color:#9fb4ff;margin-bottom:12px&quot;&gt;IA nos dados&lt;/div&gt;&lt;p style=&quot;line-height:1.55&quot;&gt;Os três MBAs trazem IA no título: Data Science com IA, Engenharia de Dados com Big Data e IA, Banco de Dados e Data Warehouse com IA. A IA é diferencial do currículo, não um Hub à parte.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;caminho&quot;&gt;&lt;div class=&quot;tag&quot;&gt;04 · Qual caminho é para você? (interativo)&lt;/div&gt;&lt;h2&gt;Qual caminho é para você?&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Escolha o que mais parece com o seu momento.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div style=&quot;grid-column:span 5&quot;&gt;&lt;button class=&quot;opt on&quot; data-i=&quot;0&quot;&gt;&lt;b&gt;Trabalho com dados, BI, marketing ou finanças&lt;/b&gt;&lt;span&gt;Quero análise avançada e IA no negócio&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;1&quot;&gt;&lt;b&gt;Sou de TI&lt;/b&gt;&lt;span&gt;Quero pipelines de Big Data&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;2&quot;&gt;&lt;b&gt;Sou DBA ou desenvolvedor SQL&lt;/b&gt;&lt;span&gt;Quero ir além da administração&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;3&quot;&gt;&lt;b&gt;Venho de outra área&lt;/b&gt;&lt;span&gt;Quero mudar para dados&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 7&quot;&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;0&quot; style=&quot;padding:32px;display:block&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Data Science com IA&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Transforme dados em análises confiáveis e decisões: estatística, modelagem e IA aplicada ao negócio, com Power BI, R, KNIME e SQL.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Aceita quem quer migrar sem domínio técnico prévio · Ter e Qui&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Já tem base em SQL e quer construir plataformas? Veja Engenharia de Dados.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;1&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Engenharia de Dados: Big Data e IA&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Projete e opere plataformas de Big Data: SQL avançado e dbt, Spark SQL, Delta Lake e Lakehouse, pipelines na AWS e streaming com Kafka, com integração a IA.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: base em programação e SQL · Seg e Qua&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;2&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Engenharia de Banco de Dados e Data Warehouse com IA&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Plataformas de dados de ponta a ponta, do banco transacional ao DW e ao BI: SQL Server 2025, Azure SQL, Fabric, Oracle 26ai, MongoDB, BigQuery, dbt e Power BI.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: conhecimentos prévios em bancos de dados · Seg e Qua&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;3&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Data Science com IA&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;A LP aceita quem quer migrar para dados mesmo sem domínio técnico prévio: você parte de SQL e estatística e chega a modelagem preditiva aplicada ao negócio.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Power BI · R · KNIME · SQL · Ter e Qui&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Quer entender a diferença entre as três carreiras? Fale com um consultor.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;comparador&quot;&gt;&lt;div class=&quot;tag&quot;&gt;05 · Comparador&lt;/div&gt;&lt;h2&gt;Compare os 3 MBAs Live lado a lado&lt;/h2&gt;&lt;div class=&quot;band&quot;&gt;&lt;span&gt;Em todos os 3: 1 ano&lt;/span&gt;&lt;span&gt;20h às 22h (aulas ao vivo)&lt;/span&gt;&lt;span&gt;64 aulas ao vivo · 8 projetos com desafios reais&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cmp&quot; style=&quot;grid-template-columns:170px repeat(3,1fr)&quot;&gt;&lt;div style=&quot;background:#1E1E1C;border-right:1px solid #3A3935&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#1E1E1C;color:#FFFFFF;line-height:1.4;border-right:1px solid #3A3935&quot;&gt;MBA em Data Science com IA&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#1E1E1C;color:#FFFFFF;line-height:1.4;border-right:1px solid #3A3935&quot;&gt;MBA em Engenharia de Dados: Big Data e IA&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#1E1E1C;color:#FFFFFF;line-height:1.4;border-right:1px solid #3A3935&quot;&gt;MBA em Engenharia de Banco de Dados e Data Warehouse com IA&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Se você quer&lt;/div&gt;&lt;div&gt;Aplicar análise avançada e IA aos dados do negócio&lt;/div&gt;&lt;div&gt;Construir pipelines e plataformas de dados em escala&lt;/div&gt;&lt;div&gt;Evoluir de DBA ou desenvolvedor SQL para plataformas de dados completas&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Para quem é&lt;/div&gt;&lt;div&gt;Profissionais de dados, BI, negócios ou quem quer migrar para dados&lt;/div&gt;&lt;div&gt;Profissionais de TI e DBAs que querem engenharia de dados moderna&lt;/div&gt;&lt;div&gt;DBAs, desenvolvedores SQL e quem trabalha com dados ou BI&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Pré-requisitos&lt;/div&gt;&lt;div&gt;Ensino superior; indicado a quem trabalha com dados, BI, marketing, finanças ou quer migrar para a área, mesmo sem domínio técnico prévio&lt;/div&gt;&lt;div&gt;Profissional de TI com base em programação e SQL que quer evoluir para engenharia de dados&lt;/div&gt;&lt;div&gt;Conhecimentos prévios em bancos de dados&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Principais tecnologias&lt;/div&gt;&lt;div&gt;Power BI · R · KNIME · SQL · estatística · mineração de texto · análise de redes&lt;/div&gt;&lt;div&gt;SQL avançado · dbt · Spark SQL · Databricks · Delta Lake · AWS Glue · Step Functions · Kafka&lt;/div&gt;&lt;div&gt;SQL Server 2025 · Azure SQL · Microsoft Fabric · Oracle 26ai · OCI · MongoDB · BigQuery · dbt · Power BI&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Cargo-alvo&lt;/div&gt;&lt;div&gt;Cientista de Dados; Analista de Dados Sênior (Data Analyst); Analista de BI e Analytics; Analytics Engineer; Analista de Modelagem Preditiva&lt;/div&gt;&lt;div&gt;Data Engineer; Senior Data Engineer / Analytics Engineer; Data Platform Engineer; MLOps Engineer / ML Platform Engineer; Data Architect / Data Platform Architect&lt;/div&gt;&lt;div&gt;Database Engineer / DBA moderno (com foco em cloud, performance e alta disponibilidade); Data Platform Engineer / Data Infrastructure Engineer; Data Architect / Data Platform Architect; Data Engineer&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Dias das aulas&lt;/div&gt;&lt;div&gt;Ter e Qui, 20h00 às 22h00&lt;/div&gt;&lt;div&gt;Seg e Qua, 20h00 às 22h00&lt;/div&gt;&lt;div&gt;Seg e Qua, 20h00 às 22h00&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-em-ciencia-de-dados-mba-data-science/&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-graduacao-em-engenharia-de-dados-big-data/&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-em-banco-de-dados-oracle-sql-server/&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;live&quot;&gt;&lt;div class=&quot;tag&quot;&gt;06 · MBA Live x EAD gravado&lt;/div&gt;&lt;h2&gt;Por que um MBA ao vivo, e não gravado&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;color:#55534D;margin-bottom:10px&quot;&gt;EAD gravado&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;color:#55534D&quot;&gt;Videoaula pronta, gravada há anos&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Travou no código? Pergunta no fórum e espera&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Prova online ou TCC no final do curso&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Estudo sozinho, sem turma&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;margin-bottom:10px&quot;&gt;MBA Live Infnet&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;&quot;&gt;64 aulas 100% ao vivo, com grade atualizada pelo mercado&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Dúvida de código resolvida na hora com o professor&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;8 projetos com desafios reais, um por disciplina&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Turma, comunidade online e Central de Carreiras com convênio com mais de 675 empresas&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;prova&quot;&gt;&lt;div class=&quot;tag&quot;&gt;07 · Prova de valor&lt;/div&gt;&lt;h2&gt;Quem ensina e quem já passou por aqui&lt;/h2&gt;&lt;h3 style=&quot;margin-top:16px&quot;&gt;Coordenação com quem atua em ciência de dados, engenharia de dados e banco de dados no mercado&lt;/h3&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(4,1fr);gap:24px&quot;&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Fernando Ferreira&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Doutor em Engenharia Elétrica (COPPE/UFRJ) · cofundador da Twist Systems · 15+ anos em IA&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Data Science com IA&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Carlos Eduardo Gertners&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;20+ anos em bancos de dados, BI e engenharia de dados · no Infnet desde 2013&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Engenharia de Dados: Big Data e IA&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Robson Combat&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Mestre em Computação Aplicada (UECE) · 20+ anos em bancos de dados e BI&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Engenharia de Banco de Dados e Data Warehouse com IA&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;border:1px dashed #8A877F;border-radius:10px;padding:24px;display:flex;flex-direction:column;justify-content:center&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:18px;line-height:1.35&quot;&gt;Professores que atuam em grandes empresas, como Microsoft, Globo, Itaú e Vivo&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:10px&quot;&gt;Quadro permanente do Infnet e especialistas convidados por disciplina&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:8px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px&quot;&gt;&lt;h3 style=&quot;font-size:22px;margin-bottom:6px&quot;&gt;8 projetos por MBA, com desafios reais&lt;/h3&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-bottom:6px&quot;&gt;Sugestões de projeto a partir da matriz curricular de cada MBA. São apenas ideias ilustrativas.&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;&lt;span class=&quot;tag&quot; style=&quot;font-size:11px&quot;&gt;Sugestão de projeto · Data Science&lt;/span&gt;&lt;br&gt;painel em Power BI com análise estatística em R e previsão de séries temporais em KNIME, a partir de dados de uma área de negócio.&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;&lt;span class=&quot;tag&quot; style=&quot;font-size:11px&quot;&gt;Sugestão de projeto · Engenharia de Dados&lt;/span&gt;&lt;br&gt;pipeline com SQL avançado, transformação com dbt, processamento em Spark SQL com Delta Lake e ingestão em tempo real com Kafka.&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;&lt;span class=&quot;tag&quot; style=&quot;font-size:11px&quot;&gt;Sugestão de projeto · Banco de Dados&lt;/span&gt;&lt;br&gt;data warehouse com modelagem relacional, carga e transformação com dbt, consultas no BigQuery e painéis em Power BI, com MongoDB para dados não estruturados.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;Como economista e profissional do mercado financeiro há mais de 10 anos, pude observar a evolução da importância de manipular dados com proficiência para tomar decisões mais ágeis e assertivas. Vislumbrando o potencial que uma formação na área de dados pode trazer à minha carreira, decidi consultar pessoas de confiança e cheguei ao Infnet.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;Anderson Sampaio Ferreira&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Data Science com IA&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;Dedicada à análise política durante toda a minha trajetória profissional, há alguns anos me deparo com o crescimento exponencial de dados e informações disponíveis na área. Quis avançar em termos de organização, processamento e análise de grande volume de dados e, para tanto, procurei o MBA em Data Science do Infnet, que me foi recomendado por especialistas, embora tenha caráter multidisciplinar.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;Debora Gershon&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Data Science com IA&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;border:1px solid #CFCCC4;background:#F2F1EC;padding:20px 24px;margin-top:8px&quot;&gt;&lt;div style=&quot;display:grid;grid-template-columns:240px 1fr;gap:24px;padding:8px 0;font-size:15px;line-height:1.5&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;font-size:11px&quot;&gt;Preparo para certificações&lt;/div&gt;&lt;div style=&quot;font-weight:600;margin-top:2px&quot;&gt;Engenharia de Banco de Dados e Data Warehouse com IA&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;color:#3A3935&quot;&gt;Desenvolva uma base sólida, alinhada às principais certificações do mercado, reconhecidas globalmente, como Oracle Database SQL, Google Professional Data Engineer, Databricks Data Engineer e Azure Data Fundamentals.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;relacionados&quot;&gt;&lt;div class=&quot;tag&quot;&gt;08 · Caminhos relacionados&lt;/div&gt;&lt;h2&gt;Dados também se conectam a IA e infraestrutura&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB INTELIGÊNCIA ARTIFICIAL&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Inteligência Artificial, Agentes e Automação&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer aplicar IA, treinar modelos ou levar agentes à produção →&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB REDES, INFRAESTRUTURA E CLOUD&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Redes, Infraestrutura e Cloud&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer projetar e operar a infraestrutura das empresas →&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;consultor&quot;&gt;&lt;div class=&quot;tag&quot;&gt;09 · Dúvidas e fale com um consultor&lt;/div&gt;&lt;div&gt;&lt;h2 style=&quot;margin-bottom:24px&quot;&gt;Dúvidas de quem está comparando&lt;/h2&gt;&lt;details open&gt;&lt;summary&gt;As aulas são ao vivo?&lt;/summary&gt;&lt;p&gt;Segundo o documento de diferenciais do Infnet, todas as aulas são 100% ao vivo, síncronas, com data e hora para acontecer; não é um modelo híbrido nem &amp;#x27;a maioria das aulas&amp;#x27;.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual a diferença entre ciência de dados, engenharia de dados e banco de dados?&lt;/summary&gt;&lt;p&gt;Ciência de dados analisa e modela dados para apoiar decisões (estatística, machine learning, Power BI, R, KNIME). Engenharia de dados constrói e opera plataformas e pipelines de Big Data (SQL avançado, dbt, Spark SQL, Delta Lake, AWS Glue, Kafka). Banco de dados e data warehouse trata de modelagem, performance, alta disponibilidade, cloud e BI (SQL Server 2025, Azure SQL, Oracle 26ai, MongoDB, BigQuery, dbt, Power BI).&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Preciso de conhecimento técnico prévio?&lt;/summary&gt;&lt;p&gt;No MBA em Data Science, a página indica quem trabalha com dados, BI, marketing ou finanças e também quem quer migrar para a área, mesmo sem domínio de programação. Engenharia de Dados pede base em programação e SQL. Banco de Dados e DW pede conhecimentos prévios em bancos de dados.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual a duração e quando começa a próxima turma?&lt;/summary&gt;&lt;p&gt;Os três têm 1 ano, com aulas das 20h00 às 22h00. Data Science: 02/02/2027 (ter e qui). Engenharia de Dados e Banco de Dados: 01/02/2027 (seg e qua).&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;O diploma é reconhecido pelo MEC?&lt;/summary&gt;&lt;p&gt;Sim. O Infnet tem nota máxima (5) no credenciamento do MEC para o ensino a distância. O diploma do MBA Live tem a mesma validade e o mesmo reconhecimento do diploma de um MBA presencial em todo o Brasil; é uma formação lato sensu, de especialista .&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Quais são as formas de pagamento?&lt;/summary&gt;&lt;p&gt;Valores e condições são apresentados pelos consultores ou no atendimento inteligente; não aparecem no Hub [regra do projeto: preço fica na LP e com o consultor].&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;div style=&quot;border:2px dashed #1f3fae;border-radius:12px;padding:12px 12px 32px;background:#F2F1EC&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;padding:4px 12px 14px&quot;&gt;[Espaço reservado · incluir aqui o bot de CTA · o formulário abaixo é a referência do que o bot deve coletar]&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;max-width:640px;margin:0 auto;padding:32px&quot;&gt;&lt;h2 style=&quot;font-size:28px;margin-bottom:8px&quot;&gt;Em dúvida entre analisar, construir pipelines ou sustentar bancos de dados? Converse com um consultor e veja como é a aula ao vivo.&lt;/h2&gt;&lt;p style=&quot;color:#55534D;margin-bottom:20px&quot;&gt;Conte seu momento de carreira e a base que você já tem. O consultor indica o caminho mais adequado.&lt;/p&gt;&lt;label&gt;Nome&lt;/label&gt;&lt;input placeholder=&quot;Seu nome&quot;&gt;&lt;label&gt;E-mail&lt;/label&gt;&lt;input placeholder=&quot;seu@email.com&quot;&gt;&lt;label&gt;WhatsApp&lt;/label&gt;&lt;input placeholder=&quot;(00) 00000-0000&quot;&gt;&lt;label&gt;Interesse&lt;/label&gt;&lt;select&gt;&lt;option&gt;Selecione o MBA&lt;/option&gt;&lt;option&gt;MBA em Data Science com IA&lt;/option&gt;&lt;option&gt;MBA em Engenharia de Dados: Big Data e IA&lt;/option&gt;&lt;option&gt;MBA em Engenharia de Banco de Dados e Data Warehouse com IA&lt;/option&gt;&lt;option&gt;Ainda não sei&lt;/option&gt;&lt;/select&gt;&lt;button class=&quot;btn dark&quot; style=&quot;width:100%;justify-content:center&quot;&gt;Quero falar com um consultor&lt;/button&gt;&lt;p style=&quot;font-size:13px;color:#55534D;margin-top:12px&quot;&gt;Atendimento inteligente pela Íris, a qualquer hora; depois, um consultor entra em contato. &lt;span class=&quot;todo&quot;&gt;[Conteúdo a criar: texto de privacidade e LGPD, a definir com o jurídico]&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;footer&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px;background-color:#333;color:#aaa&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;div style=&quot;display:flex;gap:28px&quot;&gt;&lt;span&gt;Política de privacidade&lt;/span&gt;&lt;span&gt;Faculdade Infnet&lt;/span&gt;&lt;span&gt;Contato&lt;/span&gt;&lt;/div&gt;&lt;/footer&gt;&lt;/div&gt;&lt;script&gt;document.querySelectorAll(&quot;.opt&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){var i=b.dataset.i;document.querySelectorAll(&quot;.opt&quot;).forEach(function(x){x.classList.toggle(&quot;on&quot;,x===b)});document.querySelectorAll(&quot;.rec&quot;).forEach(function(c){c.style.display=c.dataset.i===i?&quot;block&quot;:&quot;none&quot;})})})&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section><section class="hub" id="H06"><iframe title="H06" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;pt-BR&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=1440&quot;&gt;&lt;title&gt;Redes, Infraestrutura e Cloud | Faculdade Infnet&lt;/title&gt;&lt;link href=&quot;https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;&lt;style&gt;

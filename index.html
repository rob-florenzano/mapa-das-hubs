&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;details class=&quot;prod&quot;&gt;&lt;summary&gt;Notas de produção deste Hub&lt;/summary&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;SEO:&lt;/b&gt; title: Gestão de TI, Projetos e Sistemas | Faculdade Infnet · meta: Compare os MBAs em Gestão de TI, Governança e Estratégia e em Gestão de Projetos e Processos da Faculdade Infnet. Aulas ao vivo, para quem já tem experiência. · URL: /ead/hubs/gestao-de-ti-projetos-e-sistemas/ [validar no Webflow] · keywords: mba ti; mba em tecnologia; mba tecnologia da informação&lt;/li&gt;&lt;li&gt;Este Hub reúne apenas PGLLGO e PGLLPM.&lt;/li&gt;&lt;li&gt;O conceito do Mapa cita &amp;#x27;sistemas SAP&amp;#x27;, mas PGLLSA não consta na lista de cursos do Hub: aqui aparece só como opção com link para a LP do MBA em SAP. Confirmar se SAP fica fora do Hub.&lt;/li&gt;&lt;li&gt;Hub só de MBAs: sem filtro por nível.&lt;/li&gt;&lt;li&gt;Formato do wireframe antigo (9 blocos). Em amarelo: [confirmar] ou [Conteúdo a criar]. Placeholders hachurados: imagens, ícones e fotos a cargo da equipe de criação. Preço fora do Hub.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;div class=&quot;page&quot;&gt;&lt;header&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;nav&gt;&lt;span&gt;Como funciona&lt;/span&gt;&lt;span&gt;Carreiras&lt;/span&gt;&lt;span&gt;Comparar MBAs&lt;/span&gt;&lt;span&gt;Professores e alunos&lt;/span&gt;&lt;span&gt;Dúvidas&lt;/span&gt;&lt;/nav&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/header&gt;&lt;section id=&quot;topo&quot;&gt;&lt;div class=&quot;grid12&quot;&gt;&lt;div style=&quot;grid-column:span 7;display:flex;flex-direction:column;gap:24px&quot;&gt;&lt;span class=&quot;tag&quot;&gt;MBA Live ● Faculdade Infnet, referência em tecnologia há 30 anos.&lt;/span&gt;&lt;h1&gt;MBAs em Gestão de TI, Projetos e Processos&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;&lt;b&gt;Você domina a técnica. Agora precisa liderar projetos, pessoas e decisões. Escolha onde: a área de TI ou projetos e processos.&lt;/b&gt;&lt;/p&gt;&lt;p class=&quot;lead&quot;&gt;Dois MBAs Live para quem tem experiência profissional e quer assumir a liderança, traduzindo tecnologia em resultado para o negócio: a área de TI, com governança e serviços, ou projetos e processos, com métodos tradicionais e ágeis. Todas as aulas são ao vivo.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:16px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#comparador&quot;&gt;Comparar os MBAs Live&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 5;height:420px;border-radius:10px&quot;&gt;[IMAGEM · líder de tecnologia conduzindo reunião de projeto com quadro de planejamento na tela, durante a aula ao vivo · evitar reunião genérica de banco de imagens]&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:20px&quot;&gt;Os MBAs Live desta área&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#55534D&quot;&gt;2 formações · 2 caminhos · todas com duração de 1 ano&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(2,1fr);column-gap:32px;row-gap:12px;grid-template-rows:auto 1fr&quot;&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 1 · Liderar a área de TI&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para quem tem cinco anos ou mais em TI&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Gestão de TI, Governança e Estratégia&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Governe a TI com visão integrada de dados, cibersegurança, serviços, projetos e estratégia.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-em-gestao-de-ti-governanca-estrategia&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 2 · Liderar projetos e processos&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para quem já atua em projetos e quer liderar&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Gestão de Projetos e Processos com IA: Scrum, PMBOK e Metodologias Ágeis&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Lidere projetos e processos do planejamento à entrega, combinando gestão tradicional, métodos ágeis e IA.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-em-gestao-de-projetos-processos&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;num&quot;&gt;&lt;div&gt;&lt;b&gt;30 anos&lt;/b&gt;&lt;span&gt;especializada em tecnologia, desde 1994&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Live desde 2014&lt;/b&gt;&lt;span&gt;100% das aulas ao vivo&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;30 mil+&lt;/b&gt;&lt;span&gt;alunos formados em todo o Brasil&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Nota máxima (5)&lt;/b&gt;&lt;span&gt;no credenciamento EAD do MEC&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;section id=&quot;como&quot;&gt;&lt;div class=&quot;tag&quot;&gt;02 · Como funciona o MBA Live&lt;/div&gt;&lt;h2 style=&quot;max-width:760px&quot;&gt;Aula ao vivo de verdade, não videoaula gravada anos atrás&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;max-width:800px;font-size:18px&quot;&gt;Você faz parte de uma turma real e fala em tempo real com o professor. Troca com a turma, com colegas trazendo casos reais de projetos e de operação de TI, em aula ao vivo.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 7;height:460px;border-radius:10px;flex-direction:column;gap:6px&quot;&gt;&lt;span style=&quot;font-size:14px&quot;&gt;[VÍDEO · TRECHO REAL DE AULA · 60–90s]&lt;/span&gt;&lt;span style=&quot;font-size:11px&quot;&gt;usar o vídeo da página &quot;Como funciona&quot; ou gravar um trecho de aula de um dos MBAs&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 5;display:grid;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Dias e horário&lt;/div&gt;&lt;div style=&quot;font-size:20px;font-weight:700&quot;&gt;Seg e Qua ou Ter e Qui · 20h às 22h&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;64 aulas ao vivo em 1 ano, com calendário entregue no início&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Interação em tempo real&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Aulas pelo Zoom integradas ao Infnet Online. Travou num caso do projeto? A dúvida é resolvida durante a aula.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Prática com desafios reais&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Labs virtuais e 8 projetos com desafios reais, um por disciplina.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Perdeu uma aula?&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;As gravações ficam no Infnet Online para você rever quantas vezes quiser.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;carreiras&quot;&gt;&lt;div class=&quot;tag&quot;&gt;03 · A área e as carreiras&lt;/div&gt;&lt;h2&gt;O que faz quem trabalha com gestão de TI e projetos&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Liderar em tecnologia tem objetos diferentes: a própria área de TI, com governança de dados, serviços (ITIL), sourcing, cibersegurança (CISM), projetos PMI e estratégia com transformação digital; ou projetos e processos, com domínios PMI, Scrum, Kanban e Lean, carteira de projetos e VMO e BPM. São caminhos de gestão que pedem experiência, não cursos intercambiáveis para a mesma tarefa.&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Cargos&lt;/div&gt;&lt;ul style=&quot;margin:0;padding-left:20px;line-height:1.7&quot;&gt;&lt;li&gt;Coordenador de TI · Gerente de TI&lt;/li&gt;&lt;li&gt;IT Governance Manager · Data Governance Manager&lt;/li&gt;&lt;li&gt;GRC Manager · IT Strategy &amp;amp; Transformation Manager&lt;/li&gt;&lt;li&gt;Gerente de Projetos · Scrum Master&lt;/li&gt;&lt;li&gt;Coordenador de PMO · Analista de Projetos&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Tecnologias e práticas&lt;/div&gt;&lt;span class=&quot;chip&quot;&gt;Governança de dados (CDMP)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;ITIL&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Sourcing de TI&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;CISM&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Projetos PMI com IA&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;COBIT 2019&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Scrum com IA&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Kanban e Lean&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Carteira de projetos e VMO&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;BPM&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;ChatGPT Work&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;color:#9fb4ff;margin-bottom:12px&quot;&gt;Preparo para certificações&lt;/div&gt;&lt;p style=&quot;line-height:1.55&quot;&gt;Gestão de TI: conteúdo alinhado a ITIL 4 Foundation, PMP, CAPM, PMI-ACP, PSM, COBIT e certificações DevOps como DASA e DevOps Institute, segundo a página do MBA.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;caminho&quot;&gt;&lt;div class=&quot;tag&quot;&gt;04 · Qual caminho é para você? (interativo)&lt;/div&gt;&lt;h2&gt;Qual caminho é para você?&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Escolha o que mais parece com o seu momento.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div style=&quot;grid-column:span 5&quot;&gt;&lt;button class=&quot;opt on&quot; data-i=&quot;0&quot;&gt;&lt;b&gt;Tenho cinco anos ou mais em TI&lt;/b&gt;&lt;span&gt;Quero liderar a área&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;1&quot;&gt;&lt;b&gt;Atuo em projetos&lt;/b&gt;&lt;span&gt;Quero liderar entregas&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;2&quot;&gt;&lt;b&gt;Atuo com SAP&lt;/b&gt;&lt;span&gt;Projetos S/4HANA&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;3&quot;&gt;&lt;b&gt;Ainda não tenho a experiência&lt;/b&gt;&lt;span&gt;Quero montar o melhor caminho&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 7&quot;&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;0&quot; style=&quot;padding:32px;display:block&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Gestão de TI, Governança e Estratégia&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Governe a TI com visão integrada: governança de dados (DAMA-DMBOK e CDMP), cibersegurança (CISM), serviços com ITIL, sourcing e custos, projetos PMI com IA e COBIT 2019.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: mínimo de cinco anos de experiência em TI · Seg e Qua&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Seu foco é entregar projetos? Veja Gestão de Projetos e Processos com IA.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;1&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Gestão de Projetos e Processos com IA&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Lidere projetos e processos com gestão tradicional (domínios PMI), Scrum, Kanban e Lean, carteira de projetos e VMO, liderança de pessoas, agentes de IA e BPM.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: experiência prévia em projetos, em planejamento, coordenação ou execução · Ter e Qui&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;2&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Gestão de Sistemas de Informação com SAP&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;O MBA em SAP tem página própria, voltado a projetos de implantação, evolução e integração do SAP S/4HANA: processos integrados, ABAP para funcionais, SAP Activate e ITIL.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: ensino superior e no mínimo 2 anos de experiência com lógica de processos e sistemas corporativos · Ter e Qui&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-graduacao-mba-em-gestao-de-sistemas-de-informacao-com-sap/&quot;&gt;Ver o MBA&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;3&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Converse com um consultor&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Os dois MBAs pedem experiência profissional. Um consultor ajuda você a montar o melhor caminho a partir do seu histórico.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Os dois MBAs duram 1 ano e têm aulas das 20h às 22h&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;comparador&quot;&gt;&lt;div class=&quot;tag&quot;&gt;05 · Comparador&lt;/div&gt;&lt;h2&gt;Compare os 2 MBAs Live lado a lado&lt;/h2&gt;&lt;div class=&quot;band&quot;&gt;&lt;span&gt;Em todos os 2: 1 ano&lt;/span&gt;&lt;span&gt;20h às 22h (aulas ao vivo)&lt;/span&gt;&lt;span&gt;64 aulas ao vivo · 8 projetos com desafios reais&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cmp&quot; style=&quot;grid-template-columns:170px repeat(2,1fr)&quot;&gt;&lt;div style=&quot;background:#1E1E1C;border-right:1px solid #3A3935&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#1E1E1C;color:#FFFFFF;line-height:1.4;border-right:1px solid #3A3935&quot;&gt;MBA em Gestão de TI, Governança e Estratégia&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#1E1E1C;color:#FFFFFF;line-height:1.4;border-right:1px solid #3A3935&quot;&gt;MBA em Gestão de Projetos e Processos com IA: Scrum, PMBOK e Metodologias Ágeis&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Se você quer&lt;/div&gt;&lt;div&gt;Governar a TI com visão integrada de dados, segurança, serviços, projetos e estratégia&lt;/div&gt;&lt;div&gt;Liderar projetos e processos com gestão tradicional, ágil e IA&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Para quem é&lt;/div&gt;&lt;div&gt;Profissionais de TI com experiência rumo à gestão e à liderança&lt;/div&gt;&lt;div&gt;Profissionais que atuam com projetos e querem liderar&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Pré-requisitos&lt;/div&gt;&lt;div&gt;Mínimo de cinco anos de experiência na área de TI, preferencialmente em ambientes corporativos, projetos, operações ou serviços de TI, e interesse em evoluir para posições de liderança&lt;/div&gt;&lt;div&gt;Experiência prévia em projetos, com atuação em planejamento, coordenação ou execução&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Principais tecnologias&lt;/div&gt;&lt;div&gt;Governança de dados (CDMP) · ITIL · sourcing de TI · CISM · projetos PMI com IA · COBIT 2019 · transformação digital com IA&lt;/div&gt;&lt;div&gt;PMI (preditivo) · Scrum com IA · Kanban e Lean · carteira de projetos e VMO · liderança de pessoas · ChatGPT Work · BPM&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Cargo-alvo&lt;/div&gt;&lt;div&gt;Coordenador de TI; Gerente de TI; IT Governance Manager; Data Governance Manager; GRC Manager / Gerente de Governança e Riscos; IT Strategy &amp;amp; Transformation Manager&lt;/div&gt;&lt;div&gt;Gerente de Projetos; Scrum Master; Coordenador de PMO; Analista de Projetos / Project Analyst&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Dias das aulas&lt;/div&gt;&lt;div&gt;Seg e Qua, 20h00 às 22h00&lt;/div&gt;&lt;div&gt;Ter e Qui, 20h00 às 22h00&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-em-gestao-de-ti-governanca-estrategia&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-em-gestao-de-projetos-processos&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;live&quot;&gt;&lt;div class=&quot;tag&quot;&gt;06 · MBA Live x EAD gravado&lt;/div&gt;&lt;h2&gt;Por que um MBA ao vivo, e não gravado&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;color:#55534D;margin-bottom:10px&quot;&gt;EAD gravado&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;color:#55534D&quot;&gt;Videoaula pronta, gravada há anos&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Travou num caso do projeto? Pergunta no fórum e espera&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Prova online ou TCC no final do curso&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Estudo sozinho, sem turma&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;margin-bottom:10px&quot;&gt;MBA Live Infnet&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;&quot;&gt;64 aulas 100% ao vivo, com grade atualizada pelo mercado&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Dúvida de gestão resolvida na hora com o professor&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;8 projetos com desafios reais, um por disciplina&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Turma, comunidade online e Central de Carreiras com convênio com mais de 675 empresas&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;prova&quot;&gt;&lt;div class=&quot;tag&quot;&gt;07 · Prova de valor&lt;/div&gt;&lt;h2&gt;Quem ensina e quem já passou por aqui&lt;/h2&gt;&lt;h3 style=&quot;margin-top:16px&quot;&gt;Coordenação com quem atua em gestão de ti, projetos e sistemas no mercado&lt;/h3&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(2,1fr);gap:24px&quot;&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Paulo Tostes&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Doutor em Informática pela UFRJ · PMP · no Infnet desde 2010&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Gestão de TI, Governança e Estratégia; Gestão de Projetos e Processos com IA: Scrum, PMBOK e Metodologias Ágeis&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;border:1px dashed #8A877F;border-radius:10px;padding:24px;display:flex;flex-direction:column;justify-content:center&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:18px;line-height:1.35&quot;&gt;Professores que atuam em grandes empresas, como Microsoft, Globo, Itaú e Vivo&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:10px&quot;&gt;Quadro permanente do Infnet e especialistas convidados por disciplina&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:8px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px&quot;&gt;&lt;h3 style=&quot;font-size:22px;margin-bottom:6px&quot;&gt;8 projetos por MBA, com desafios reais&lt;/h3&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-bottom:6px&quot;&gt;Sugestões de projeto a partir da matriz curricular de cada MBA. São apenas ideias ilustrativas.&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;&lt;span class=&quot;tag&quot; style=&quot;font-size:11px&quot;&gt;Sugestão de projeto · Gestão de TI&lt;/span&gt;&lt;br&gt;plano de governança para uma empresa, com governança de dados, serviços com ITIL, riscos de segurança (CISM), contratos de sourcing e roteiro de transformação digital.&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;&lt;span class=&quot;tag&quot; style=&quot;font-size:11px&quot;&gt;Sugestão de projeto · Gestão de Projetos e Processos&lt;/span&gt;&lt;br&gt;planejamento de um projeto com domínios PMI, backlog em Scrum, fluxo em Kanban, priorização da carteira de projetos e mapeamento de um processo de negócio.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;O MBA em Gestão de TI me preparou bem para o mercado, além de ajudar nas certificações e no networking, que abriu novas oportunidades profissionais. Os professores também são ótimos e bem atualizados com o mercado.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;Roberto Botafogo&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Gestão de TI, Governança e Estratégia&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;Carreira vai, carreira vem e a crise chegou. A vida apertou e resolvi me mudar para a Irlanda. Vim sem emprego, sem casa, sem conhecer ninguém. Comecei a procurar um emprego e notei a fantástica receptividade por conta do meu MBA. Rapidamente consegui uma colocação. Um dos grandes orgulhos que tenho é ver o MBA que fiz figurar dentre os melhores na Você S/A: essa revista foi uma das poucas coisas que trouxe comigo quando me mudei para a Irlanda.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;Christian Alexander&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Gestão de TI, Governança e Estratégia&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;border:1px solid #CFCCC4;background:#F2F1EC;padding:20px 24px;margin-top:8px&quot;&gt;&lt;div style=&quot;display:grid;grid-template-columns:240px 1fr;gap:24px;padding:8px 0;font-size:15px;line-height:1.5&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;font-size:11px&quot;&gt;Preparo para certificações&lt;/div&gt;&lt;div style=&quot;font-weight:600;margin-top:2px&quot;&gt;Gestão de TI, Governança e Estratégia&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;color:#3A3935&quot;&gt;Desenvolva uma base sólida, alinhada às principais certificações do mercado, reconhecidas globalmente, como ITIL 4 Foundation, PMP, CAPM, PMI-ACP, PSM, COBIT e certificações DevOps como DASA e DevOps Institute.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;relacionados&quot;&gt;&lt;div class=&quot;tag&quot;&gt;08 · Caminhos relacionados&lt;/div&gt;&lt;h2&gt;Gestão também se conecta a segurança e infraestrutura&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB CIBERSEGURANÇA&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Cibersegurança e Segurança da Informação&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer atuar em operações de segurança ou em governança e riscos →&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB REDES, INFRAESTRUTURA E CLOUD&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Redes, Infraestrutura e Cloud&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer projetar e operar a infraestrutura das empresas →&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;MBA em Gestão de Sistemas de Informação com SAP (LP do curso)&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;consultor&quot;&gt;&lt;div class=&quot;tag&quot;&gt;09 · Dúvidas e fale com um consultor&lt;/div&gt;&lt;div&gt;&lt;h2 style=&quot;margin-bottom:24px&quot;&gt;Dúvidas de quem está comparando&lt;/h2&gt;&lt;details open&gt;&lt;summary&gt;As aulas são ao vivo?&lt;/summary&gt;&lt;p&gt;Segundo o documento de diferenciais do Infnet, todas as aulas são 100% ao vivo, síncronas, com data e hora para acontecer; não é um modelo híbrido nem &amp;#x27;a maioria das aulas&amp;#x27;.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual caminho escolher: gestão de TI ou projetos?&lt;/summary&gt;&lt;p&gt;Gestão de TI, Governança e Estratégia: governança e qualidade de dados (DAMA-DMBOK e CDMP), qualidade de serviços com ITIL, sourcing de TI, riscos e programas de segurança (CISM), projetos PMI com IA e estratégia de TI e transformação digital com IA, com COBIT 2019 na governança; para quem quer liderar a área de TI. Gestão de Projetos e Processos com IA: domínios de gestão de projetos PMI, Scrum com IA, Kanban e Lean, carteira de projetos e VMO, liderança de pessoas, agentes de IA e gerenciamento de processos de negócio (BPM); para quem quer liderar projetos e processos.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Que experiência prévia é exigida?&lt;/summary&gt;&lt;p&gt;Gestão de TI: mínimo de cinco anos de experiência na área de TI, preferencialmente em ambientes corporativos, e interesse em liderança. Gestão de Projetos e Processos: experiência prévia em projetos, com atuação em planejamento, coordenação ou execução.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;E se eu atuo com SAP?&lt;/summary&gt;&lt;p&gt;O MBA em Gestão de Sistemas de Informação com SAP tem página própria, voltada a projetos SAP S/4HANA.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;O diploma é reconhecido pelo MEC?&lt;/summary&gt;&lt;p&gt;Sim. O Infnet tem nota máxima (5) no credenciamento do MEC para o ensino a distância. O diploma do MBA Live tem a mesma validade e o mesmo reconhecimento do diploma de um MBA presencial em todo o Brasil; é uma formação lato sensu, de especialista .&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Quais são as formas de pagamento?&lt;/summary&gt;&lt;p&gt;Valores e condições são apresentados pelos consultores ou no atendimento inteligente; não aparecem no Hub [regra do projeto: preço fica na LP e com o consultor].&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;div style=&quot;border:2px dashed #1f3fae;border-radius:12px;padding:12px 12px 32px;background:#F2F1EC&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;padding:4px 12px 14px&quot;&gt;[Espaço reservado · incluir aqui o bot de CTA · o formulário abaixo é a referência do que o bot deve coletar]&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;max-width:640px;margin:0 auto;padding:32px&quot;&gt;&lt;h2 style=&quot;font-size:28px;margin-bottom:8px&quot;&gt;Em dúvida entre gestão de TI e projetos? Converse com um consultor e veja como é a aula ao vivo.&lt;/h2&gt;&lt;p style=&quot;color:#55534D;margin-bottom:20px&quot;&gt;Conte seu momento de carreira e a base que você já tem. O consultor indica o caminho mais adequado.&lt;/p&gt;&lt;label&gt;Nome&lt;/label&gt;&lt;input placeholder=&quot;Seu nome&quot;&gt;&lt;label&gt;E-mail&lt;/label&gt;&lt;input placeholder=&quot;seu@email.com&quot;&gt;&lt;label&gt;WhatsApp&lt;/label&gt;&lt;input placeholder=&quot;(00) 00000-0000&quot;&gt;&lt;label&gt;Interesse&lt;/label&gt;&lt;select&gt;&lt;option&gt;Selecione o MBA&lt;/option&gt;&lt;option&gt;MBA em Gestão de TI, Governança e Estratégia&lt;/option&gt;&lt;option&gt;MBA em Gestão de Projetos e Processos com IA: Scrum, PMBOK e Metodologias Ágeis&lt;/option&gt;&lt;option&gt;Ainda não sei&lt;/option&gt;&lt;/select&gt;&lt;button class=&quot;btn dark&quot; style=&quot;width:100%;justify-content:center&quot;&gt;Quero falar com um consultor&lt;/button&gt;&lt;p style=&quot;font-size:13px;color:#55534D;margin-top:12px&quot;&gt;Atendimento inteligente pela Íris, a qualquer hora; depois, um consultor entra em contato. &lt;span class=&quot;todo&quot;&gt;[Conteúdo a criar: texto de privacidade e LGPD, a definir com o jurídico]&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;footer&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px;background-color:#333;color:#aaa&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;div style=&quot;display:flex;gap:28px&quot;&gt;&lt;span&gt;Política de privacidade&lt;/span&gt;&lt;span&gt;Faculdade Infnet&lt;/span&gt;&lt;span&gt;Contato&lt;/span&gt;&lt;/div&gt;&lt;/footer&gt;&lt;/div&gt;&lt;script&gt;document.querySelectorAll(&quot;.opt&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){var i=b.dataset.i;document.querySelectorAll(&quot;.opt&quot;).forEach(function(x){x.classList.toggle(&quot;on&quot;,x===b)});document.querySelectorAll(&quot;.rec&quot;).forEach(function(c){c.style.display=c.dataset.i===i?&quot;block&quot;:&quot;none&quot;})})})&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section></div></body></html>

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;details class=&quot;prod&quot;&gt;&lt;summary&gt;Notas de produção deste Hub&lt;/summary&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;SEO:&lt;/b&gt; title: Redes, Infraestrutura e Cloud | Faculdade Infnet · meta: Compare os MBAs em Engenharia de Redes e em Cloud Computing da Faculdade Infnet. Aulas 100% ao vivo. · URL: /ead/hubs/redes-infraestrutura-e-cloud/ [validar no Webflow] · keywords: curso cloud; rede de computadores; infraestrutura de ti&lt;/li&gt;&lt;li&gt;Decisão de 10/11/2026: o projeto não inclui graduações; este Hub tem só os dois MBAs.&lt;/li&gt;&lt;li&gt;Mapa das Hubs: o MBA em Arquitetura de Software (PGLLAR) está no H01; aparece aqui só como relacionado.&lt;/li&gt;&lt;li&gt;O Hub HECC já publicado (Cibersegurança e Cloud) tem outro uso e coexiste com H06 e H07.&lt;/li&gt;&lt;li&gt;Formato do wireframe antigo (9 blocos). Em amarelo: [confirmar] ou [Conteúdo a criar]. Placeholders hachurados: imagens, ícones e fotos a cargo da equipe de criação. Preço fora do Hub.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;div class=&quot;page&quot;&gt;&lt;header&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;nav&gt;&lt;span&gt;Como funciona&lt;/span&gt;&lt;span&gt;Carreiras&lt;/span&gt;&lt;span&gt;Comparar MBAs&lt;/span&gt;&lt;span&gt;Professores e alunos&lt;/span&gt;&lt;span&gt;Dúvidas&lt;/span&gt;&lt;/nav&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/header&gt;&lt;section id=&quot;topo&quot;&gt;&lt;div class=&quot;grid12&quot;&gt;&lt;div style=&quot;grid-column:span 7;display:flex;flex-direction:column;gap:24px&quot;&gt;&lt;span class=&quot;tag&quot;&gt;HUB REDES, INFRAESTRUTURA E CLOUD · MBAs Live em Gestão e Engenharias Tech · EAD nota máxima (5) no MEC, com todas as aulas ao vivo&lt;/span&gt;&lt;h1&gt;MBAs em Redes, Infraestrutura e Cloud&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;&lt;b&gt;A infraestrutura está saindo da sala de servidores para a nuvem e a automação. Escolha como projetar e operar o ambiente das empresas.&lt;/b&gt;&lt;/p&gt;&lt;p class=&quot;lead&quot;&gt;Dois MBAs Live para quem projeta e opera os ambientes das empresas: infraestrutura e redes, ou cloud em produção. O trabalho manual em servidores tende a encolher; cresce a demanda por quem automatiza e opera na nuvem. Compare os caminhos. Todas as aulas são ao vivo.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:16px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#comparador&quot;&gt;Comparar os MBAs Live&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 5;height:420px;border-radius:10px&quot;&gt;[IMAGEM · profissional de infraestrutura com terminal e painel de rede ou cloud durante a aula ao vivo · evitar fotos genéricas de data center]&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:20px&quot;&gt;Os MBAs Live desta área&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#55534D&quot;&gt;2 formações · 2 caminhos · todas com duração de 1 ano&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(2,1fr);column-gap:32px;row-gap:12px;grid-template-rows:auto 1fr&quot;&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 1 · Engenharia de infraestrutura e redes&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para quem tem graduação em TI e familiaridade com redes&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia de Redes de Computadores&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Projete, integre e sustente ambientes de infraestrutura corporativa.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-em-redes/&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 2 · Cloud em produção&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para quem conhece redes e sistemas e quer operar a nuvem&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia de Cloud Computing&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Projete, implemente e sustente ambientes cloud em produção na AWS, Azure e Google Cloud, com Docker, Kubernetes e Red Hat OpenShift.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-graduacao-cloud-computing/&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;num&quot;&gt;&lt;div&gt;&lt;b&gt;30 anos&lt;/b&gt;&lt;span&gt;especializada em tecnologia, desde 1994&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Live desde 2014&lt;/b&gt;&lt;span&gt;100% das aulas ao vivo&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;30 mil+&lt;/b&gt;&lt;span&gt;alunos formados em todo o Brasil&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Nota máxima (5)&lt;/b&gt;&lt;span&gt;no credenciamento EAD do MEC&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;section id=&quot;como&quot;&gt;&lt;div class=&quot;tag&quot;&gt;02 · Como funciona o MBA Live&lt;/div&gt;&lt;h2 style=&quot;max-width:760px&quot;&gt;Aula ao vivo de verdade, não videoaula gravada anos atrás&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;max-width:800px;font-size:18px&quot;&gt;Você faz parte de uma turma real e fala em tempo real com o professor. Laboratórios e demonstrações de ambientes reais, com dúvida resolvida na hora, em aula ao vivo.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 7;height:460px;border-radius:10px;flex-direction:column;gap:6px&quot;&gt;&lt;span style=&quot;font-size:14px&quot;&gt;[VÍDEO · TRECHO REAL DE AULA · 60–90s]&lt;/span&gt;&lt;span style=&quot;font-size:11px&quot;&gt;usar o vídeo da página &quot;Como funciona&quot; ou gravar um trecho de aula de um dos MBAs&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 5;display:grid;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Dias e horário&lt;/div&gt;&lt;div style=&quot;font-size:20px;font-weight:700&quot;&gt;Seg e Qua · 20h às 22h&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;64 aulas ao vivo em 1 ano, com calendário entregue no início&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Interação em tempo real&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Aulas pelo Zoom integradas ao Infnet Online. Travou no código? A dúvida é resolvida durante a aula.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Prática com desafios reais&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Labs virtuais e 8 projetos com desafios reais, um por disciplina, que formam o seu portfólio.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Perdeu uma aula?&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;As gravações ficam no Infnet Online para você rever quantas vezes quiser.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;carreiras&quot;&gt;&lt;div class=&quot;tag&quot;&gt;03 · A área e as carreiras&lt;/div&gt;&lt;h2&gt;O que faz quem trabalha com infraestrutura, redes e cloud&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Infraestrutura é o que sustenta o software das empresas: redes, sistemas e ambientes cloud. Os MBAs seguem para a engenharia de infraestrutura corporativa ou para cloud em produção (AWS, Azure e Google Cloud), com containers e Kubernetes.&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Cargos&lt;/div&gt;&lt;ul style=&quot;margin:0;padding-left:20px;line-height:1.7&quot;&gt;&lt;li&gt;Engenheiro(a) de Redes&lt;/li&gt;&lt;li&gt;Analista de Infraestrutura Sênior · Administrador(a) de Sistemas&lt;/li&gt;&lt;li&gt;Especialista em Segurança de Redes&lt;/li&gt;&lt;li&gt;Cloud Engineer · Cloud / Solutions Architect&lt;/li&gt;&lt;li&gt;DevOps Engineer · Platform Engineer · SRE&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Tecnologias e práticas&lt;/div&gt;&lt;span class=&quot;chip&quot;&gt;CCNA&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;LPIC-1&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Azure (AZ-104)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;ITIL&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Segurança de redes&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;AWS&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Google Cloud&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Docker&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Kubernetes&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Red Hat OpenShift&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;color:#9fb4ff;margin-bottom:12px&quot;&gt;Preparo para certificações&lt;/div&gt;&lt;p style=&quot;line-height:1.55&quot;&gt;As grades têm conteúdo alinhado a CCNA, LPIC-1, AZ-104, ITIL Foundation e ISO/IEC 27001 (Redes) e a AWS Solutions Architect Associate, Azure AZ-305, Google Cloud Architect e Red Hat OpenShift (Cloud).&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px;color:#55534D&quot;&gt;Sem promessa de salário, emprego ou prazo de transição.&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;caminho&quot;&gt;&lt;div class=&quot;tag&quot;&gt;04 · Qual caminho é para você? (interativo)&lt;/div&gt;&lt;h2&gt;Qual caminho é para você?&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Escolha o que mais parece com o seu momento.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div style=&quot;grid-column:span 5&quot;&gt;&lt;button class=&quot;opt on&quot; data-i=&quot;0&quot;&gt;&lt;b&gt;Tenho graduação em TI&lt;/b&gt;&lt;span&gt;Quero a infraestrutura completa&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;1&quot;&gt;&lt;b&gt;Conheço redes e sistemas operacionais&lt;/b&gt;&lt;span&gt;Quero cloud em produção&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;2&quot;&gt;&lt;b&gt;Sou desenvolvedor&lt;/b&gt;&lt;span&gt;Quero decidir a arquitetura&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;3&quot;&gt;&lt;b&gt;Meu foco é segurança&lt;/b&gt;&lt;span&gt;Defesa, riscos ou compliance&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 7&quot;&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;0&quot; style=&quot;padding:32px;display:block&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Engenharia de Redes de Computadores&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Projete, integre e sustente ambientes de infraestrutura corporativa: redes, sistemas operacionais, cloud, segurança e operação, com conteúdo alinhado a CCNA, LPIC-1 e AZ-104.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: graduação em TI e familiaridade com redes, sistemas ou infraestrutura · Seg e Qua&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Já domina redes e quer cloud em produção? Veja Cloud Computing.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;1&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Engenharia de Cloud Computing&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Projete, implemente e sustente ambientes cloud na AWS, Azure e Google Cloud, com Docker, Kubernetes e Red Hat OpenShift.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: redes, sistemas operacionais e noções de implantação de infraestrutura · Seg e Qua&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;2&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Arquitetura de Software: Cloud, Dados e IA&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Para quem tem experiência sólida em desenvolvimento e quer decidir sobre sistemas distribuídos, cloud-native e dados. Está no Hub de Engenharia de Software.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: experiência sólida em desenvolvimento, APIs e modelagem · Ter e Qui&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-arquitetura-de-software/&quot;&gt;Ver o MBA&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;3&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Hub Cibersegurança e Segurança da Informação&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Se o seu objetivo é proteger sistemas e organizações, veja os MBAs do Hub de Cibersegurança, pelo lado técnico ou pelo de gestão.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Engenharia de Cibersegurança · Gestão de Riscos, Compliance e Segurança da Informação&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#&quot;&gt;Ver o Hub&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;comparador&quot;&gt;&lt;div class=&quot;tag&quot;&gt;05 · Comparador&lt;/div&gt;&lt;h2&gt;Compare os 2 MBAs Live lado a lado&lt;/h2&gt;&lt;div class=&quot;band&quot;&gt;&lt;span&gt;Em todos os 2: 1 ano&lt;/span&gt;&lt;span&gt;20h às 22h (aulas ao vivo)&lt;/span&gt;&lt;span&gt;64 aulas ao vivo · 8 projetos com desafios reais&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cmp&quot; style=&quot;grid-template-columns:170px repeat(2,1fr)&quot;&gt;&lt;div class=&quot;rh&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#F2F1EC;line-height:1.4&quot;&gt;MBA em Engenharia de Redes de Computadores&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#F2F1EC;line-height:1.4&quot;&gt;MBA em Engenharia de Cloud Computing&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Se você quer&lt;/div&gt;&lt;div&gt;Evoluir para a engenharia de infraestrutura completa&lt;/div&gt;&lt;div&gt;Operar e arquitetar ambientes cloud em produção&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Para quem é&lt;/div&gt;&lt;div&gt;Profissionais com graduação em TI, em infraestrutura e redes&lt;/div&gt;&lt;div&gt;Profissionais de infraestrutura, redes e sistemas rumo a cloud, DevOps ou SRE&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Pré-requisitos&lt;/div&gt;&lt;div&gt;Graduação em TI e familiaridade com redes, sistemas operacionais ou infraestrutura&lt;/div&gt;&lt;div&gt;Conhecimentos em redes de computadores, fundamentos de sistemas operacionais e noções de implantação de infraestrutura de TI&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Principais tecnologias&lt;/div&gt;&lt;div&gt;CCNA · LPIC-1 · Azure (AZ-104) · ITIL · segurança de redes&lt;/div&gt;&lt;div&gt;AWS · Azure · Google Cloud · Docker · Kubernetes · Red Hat OpenShift&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Cargo-alvo&lt;/div&gt;&lt;div&gt;Engenheiro(a) de Redes; Analista de Infraestrutura Sênior; Engenheiro(a) de Cloud (redes e infraestrutura); Especialista em Segurança de Redes; Administrador(a) de Sistemas (Linux/Windows)&lt;/div&gt;&lt;div&gt;Cloud Engineer / Cloud Infrastructure Engineer; Cloud / Solutions Architect; DevOps Engineer / Platform Engineer; Site Reliability Engineer (SRE)&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Dias das aulas&lt;/div&gt;&lt;div&gt;Seg e Qua, 20h00 às 22h00&lt;/div&gt;&lt;div&gt;Seg e Qua, 20h00 às 22h00&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-em-redes/&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-graduacao-cloud-computing/&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px;color:#55534D&quot;&gt;Sem preço nesta tabela: valores e condições ficam na página de cada MBA e com o consultor.&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;live&quot;&gt;&lt;div class=&quot;tag&quot;&gt;06 · MBA Live x pós EAD gravada&lt;/div&gt;&lt;h2&gt;Por que uma pós ao vivo, e não gravada&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;color:#55534D;margin-bottom:10px&quot;&gt;Pós EAD gravada&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;color:#55534D&quot;&gt;Videoaula pronta, gravada há anos&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Travou no código? Pergunta no fórum e espera&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Prova online ou TCC no final do curso&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Estudo sozinho, sem turma&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;margin-bottom:10px&quot;&gt;MBA Live Infnet&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;&quot;&gt;64 aulas 100% ao vivo, com grade atualizada pelo mercado&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Dúvida de código resolvida na hora com o professor&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;8 projetos práticos que viram portfólio&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Turma, comunidade online e Central de Carreiras com convênio com mais de 675 empresas&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;prova&quot;&gt;&lt;div class=&quot;tag&quot;&gt;07 · Prova de valor&lt;/div&gt;&lt;h2&gt;Quem ensina e quem já passou por aqui&lt;/h2&gt;&lt;h3 style=&quot;margin-top:16px&quot;&gt;Coordenação com quem atua em redes, infraestrutura e cloud no mercado&lt;/h3&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px&quot;&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Paulo Tostes&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Doutor em Informática pela UFRJ · PMP · no Infnet desde 2010&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Engenharia de Redes de Computadores&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Gustavo Marchisotti&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Doutor em Sistemas de Gestão Sustentáveis (UFF) · 25+ anos em cloud e telecom&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Engenharia de Cloud Computing&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;border:1px dashed #8A877F;border-radius:10px;padding:24px;display:flex;flex-direction:column;justify-content:center&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:18px;line-height:1.35&quot;&gt;Professores que atuam no mercado, com experiência em grandes empresas&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:10px&quot;&gt;Quadro permanente do Infnet e especialistas convidados por disciplina&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:8px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px&quot;&gt;&lt;h3 style=&quot;font-size:22px;margin-bottom:16px&quot;&gt;8 projetos por MBA, direto para o portfólio&lt;/h3&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;Redes: ambiente corporativo com roteamento, Linux e Azure&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;Cloud: arquitetura em AWS com containers e Kubernetes&lt;/div&gt;&lt;div style=&quot;font-size:12px;color:#55534D;margin-top:14px&quot;&gt;Exemplos derivados das competências das grades · validar com a coordenação&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;Quando pensei em realizar uma pós-graduação em Redes de Computadores, pesquisei por uma instituição de nome no mercado de TI, com conteúdo atual. Além de bom networking e progressão financeira, logo no primeiro contato as empresas diziam que me convocaram pela especialização no Infnet. Sem dúvida, é uma estratégia muito boa para quem quer, além de obter um certificado de pós-graduação, se preparar para as certificações, ter acesso aos labs da própria Cisco e da Microsoft.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;José Leandro Sant Anna&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Engenharia de Redes de Computadores&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;A pós-graduação em Redes de Computadores é de alto nível e ajudou-me a aprofundar meus conhecimentos e obter conhecimentos suficientes para tirar as certificações CCNA Cisco, LPIC-1 e LPIC-2 Linux e ITIL V3. Agradeço à coordenação, aos professores e ao Infnet por tudo que eu conquistei.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;André Araújo&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Engenharia de Redes de Computadores&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-top:8px&quot;&gt;Preparo para certificações&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:6px&quot;&gt;MBA em Engenharia de Redes de Computadores&lt;/div&gt;&lt;p style=&quot;font-size:15px;color:#3A3935&quot;&gt;CCNA, LPIC-1, AZ-104, ITIL Foundation e ISO/IEC 27001&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:6px&quot;&gt;MBA em Engenharia de Cloud Computing&lt;/div&gt;&lt;p style=&quot;font-size:15px;color:#3A3935&quot;&gt;AWS Certified Solutions Architect – Associate, Azure AZ-305, Google Cloud Architect e Red Hat Certified Specialist in OpenShift Administration&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;relacionados&quot;&gt;&lt;div class=&quot;tag&quot;&gt;08 · Caminhos relacionados&lt;/div&gt;&lt;h2&gt;Infraestrutura também se conecta a segurança, dados e software&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB CIBERSEGURANÇA&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Cibersegurança e Segurança da Informação&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer atuar em operações de segurança ou em governança e riscos →&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB DADOS&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Ciência de Dados, Engenharia de Dados e Banco de Dados&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer analisar, construir pipelines ou sustentar bancos de dados →&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;MBA em Arquitetura de Software: Cloud, Dados e IA (Hub H01)&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;consultor&quot;&gt;&lt;div class=&quot;tag&quot;&gt;09 · Dúvidas e fale com um consultor&lt;/div&gt;&lt;div&gt;&lt;h2 style=&quot;margin-bottom:24px&quot;&gt;Dúvidas de quem está comparando&lt;/h2&gt;&lt;details open&gt;&lt;summary&gt;As aulas são ao vivo?&lt;/summary&gt;&lt;p&gt;Segundo o documento de diferenciais do Infnet, todas as aulas são 100% ao vivo, síncronas, com data e hora para acontecer; não é um modelo híbrido nem &amp;#x27;a maioria das aulas&amp;#x27;.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual a diferença entre Redes e Cloud?&lt;/summary&gt;&lt;p&gt;Engenharia de Redes cobre infraestrutura corporativa: redes, sistemas operacionais, cloud, segurança e operação, alinhada a CCNA, LPIC-1 e AZ-104. Cloud Computing foca em ambientes em produção na AWS, Azure e Google Cloud, com Docker, Kubernetes e Red Hat OpenShift.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Preciso de graduação em TI?&lt;/summary&gt;&lt;p&gt;Engenharia de Redes é voltada a profissionais com graduação em TI e familiaridade com redes, sistemas ou infraestrutura. Cloud pede conhecimentos em redes, sistemas operacionais e noções de implantação de infraestrutura.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual a duração e quando começa a próxima turma?&lt;/summary&gt;&lt;p&gt;Os dois têm 1 ano, com aulas das 20h00 às 22h00, às segundas e quartas, e a próxima turma de ambos começa em 01/02/2027.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;O diploma é reconhecido pelo MEC?&lt;/summary&gt;&lt;p&gt;Sim. O Infnet tem nota máxima (5) no credenciamento do MEC para o ensino a distância, e o diploma de MBA é de pós-graduação lato sensu, igual ao da presencial .&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Quais são as formas de pagamento?&lt;/summary&gt;&lt;p&gt;Valores e condições são apresentados pelos consultores ou no atendimento inteligente; não aparecem no Hub [regra do projeto: preço fica na LP e com o consultor].&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;div style=&quot;border:2px dashed #1f3fae;border-radius:12px;padding:12px 12px 32px;background:#F2F1EC&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;padding:4px 12px 14px&quot;&gt;[Espaço reservado · incluir aqui o bot de CTA · o formulário abaixo é a referência do que o bot deve coletar]&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;max-width:640px;margin:0 auto;padding:32px&quot;&gt;&lt;h2 style=&quot;font-size:28px;margin-bottom:8px&quot;&gt;Em dúvida entre redes e cloud? Converse com um consultor e veja como é a aula ao vivo.&lt;/h2&gt;&lt;p style=&quot;color:#55534D;margin-bottom:20px&quot;&gt;Conte seu momento de carreira e a base que você já tem. O consultor indica o caminho mais adequado.&lt;/p&gt;&lt;label&gt;Nome&lt;/label&gt;&lt;input placeholder=&quot;Seu nome&quot;&gt;&lt;label&gt;E-mail&lt;/label&gt;&lt;input placeholder=&quot;seu@email.com&quot;&gt;&lt;label&gt;WhatsApp&lt;/label&gt;&lt;input placeholder=&quot;(00) 00000-0000&quot;&gt;&lt;label&gt;Interesse&lt;/label&gt;&lt;select&gt;&lt;option&gt;Selecione o MBA&lt;/option&gt;&lt;option&gt;MBA em Engenharia de Redes de Computadores&lt;/option&gt;&lt;option&gt;MBA em Engenharia de Cloud Computing&lt;/option&gt;&lt;option&gt;Ainda não sei&lt;/option&gt;&lt;/select&gt;&lt;button class=&quot;btn dark&quot; style=&quot;width:100%;justify-content:center&quot;&gt;Quero falar com um consultor&lt;/button&gt;&lt;p style=&quot;font-size:13px;color:#55534D;margin-top:12px&quot;&gt;Atendimento inteligente pela Íris, a qualquer hora; depois, um consultor entra em contato. &lt;span class=&quot;todo&quot;&gt;[Conteúdo a criar: texto de privacidade e LGPD, a definir com o jurídico]&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;footer&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px;background-color:#333;color:#aaa&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;div style=&quot;display:flex;gap:28px&quot;&gt;&lt;span&gt;Política de privacidade&lt;/span&gt;&lt;span&gt;Faculdade Infnet&lt;/span&gt;&lt;span&gt;Contato&lt;/span&gt;&lt;/div&gt;&lt;/footer&gt;&lt;/div&gt;&lt;script&gt;document.querySelectorAll(&quot;.opt&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){var i=b.dataset.i;document.querySelectorAll(&quot;.opt&quot;).forEach(function(x){x.classList.toggle(&quot;on&quot;,x===b)});document.querySelectorAll(&quot;.rec&quot;).forEach(function(c){c.style.display=c.dataset.i===i?&quot;block&quot;:&quot;none&quot;})})})&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section><section class="hub" id="H07"><iframe title="H07" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;pt-BR&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=1440&quot;&gt;&lt;title&gt;Cibersegurança e Segurança da Informação | Faculdade Infnet&lt;/title&gt;&lt;link href=&quot;https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;details class=&quot;prod&quot;&gt;&lt;summary&gt;Notas de produção deste Hub&lt;/summary&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;SEO:&lt;/b&gt; title: Cibersegurança e Segurança da Informação | Faculdade Infnet · meta: Compare os MBAs em cibersegurança e segurança da informação da Faculdade Infnet: operações de segurança ou gestão de riscos e compliance. Aulas ao vivo. · URL: /ead/hubs/ciberseguranca-e-seguranca-da-informacao/ [validar no Webflow] · keywords: curso segurança da informação; mba cyber security; pós-graduação segurança da informação&lt;/li&gt;&lt;li&gt;Decisão de 10/11/2026: o projeto não inclui graduações; este Hub tem só os dois MBAs.&lt;/li&gt;&lt;li&gt;O Hub HECC já publicado (Cibersegurança e Cloud) coexiste com este; a campanha PGLHECC continua levando a ele.&lt;/li&gt;&lt;li&gt;A campanha PGLLSE (Pesquisa) está pausada na conta; o MBA de Riscos hoje só aparece via HECC.&lt;/li&gt;&lt;li&gt;Formato do wireframe antigo (9 blocos). Em amarelo: [confirmar] ou [Conteúdo a criar]. Placeholders hachurados: imagens, ícones e fotos a cargo da equipe de criação. Preço fora do Hub.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;div class=&quot;page&quot;&gt;&lt;header&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;nav&gt;&lt;span&gt;Como funciona&lt;/span&gt;&lt;span&gt;Carreiras&lt;/span&gt;&lt;span&gt;Comparar MBAs&lt;/span&gt;&lt;span&gt;Professores e alunos&lt;/span&gt;&lt;span&gt;Dúvidas&lt;/span&gt;&lt;/nav&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/header&gt;&lt;section id=&quot;topo&quot;&gt;&lt;div class=&quot;grid12&quot;&gt;&lt;div style=&quot;grid-column:span 7;display:flex;flex-direction:column;gap:24px&quot;&gt;&lt;span class=&quot;tag&quot;&gt;HUB CIBERSEGURANÇA · MBAs Live em Gestão e Engenharias Tech · EAD nota máxima (5) no MEC, com todas as aulas ao vivo&lt;/span&gt;&lt;h1&gt;MBAs em Cibersegurança e Segurança da Informação&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;&lt;b&gt;O Brasil está entre os países mais atacados do mundo e as empresas precisam de quem defenda e de quem governe. Escolha seu caminho em segurança.&lt;/b&gt;&lt;/p&gt;&lt;p class=&quot;lead&quot;&gt;Cibersegurança, segurança da informação, cyber security: o nome muda, a escolha é a mesma. Compare os dois MBAs, pelo lado técnico (operações, resposta a incidentes, pentest) ou pelo lado da gestão (governança, riscos e compliance). Todas as aulas são ao vivo.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:16px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#comparador&quot;&gt;Comparar os MBAs Live&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 5;height:420px;border-radius:10px&quot;&gt;[IMAGEM · profissional em sala de operações de segurança, com painéis de alertas abstratos na tela durante a aula ao vivo · evitar clichê de hacker encapuzado]&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:20px&quot;&gt;Os MBAs Live desta área&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#55534D&quot;&gt;2 formações · 2 caminhos · todas com duração de 1 ano&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(2,1fr);column-gap:32px;row-gap:12px;grid-template-rows:auto 1fr&quot;&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 1 · Operações de segurança (técnico)&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para quem tem base em sistemas, redes e programação&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia de Cibersegurança&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Detecte, investigue, responda e simule ataques em ambientes corporativos.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-graduacao-mba-engenharia-ciberseguranca-ead/&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 2 · Governança, riscos e compliance (gestão)&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para quem tem experiência em TI, segurança ou compliance&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Gestão de Riscos, Compliance e Segurança da Informação&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Lidere governança, continuidade, privacidade e resposta a incidentes em cenários críticos.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-pos-graduacao-em-seguranca-da-informacao/&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;num&quot;&gt;&lt;div&gt;&lt;b&gt;30 anos&lt;/b&gt;&lt;span&gt;especializada em tecnologia, desde 1994&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Live desde 2014&lt;/b&gt;&lt;span&gt;100% das aulas ao vivo&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;30 mil+&lt;/b&gt;&lt;span&gt;alunos formados em todo o Brasil&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Nota máxima (5)&lt;/b&gt;&lt;span&gt;no credenciamento EAD do MEC&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;section id=&quot;como&quot;&gt;&lt;div class=&quot;tag&quot;&gt;02 · Como funciona o MBA Live&lt;/div&gt;&lt;h2 style=&quot;max-width:760px&quot;&gt;Aula ao vivo de verdade, não videoaula gravada anos atrás&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;max-width:800px;font-size:18px&quot;&gt;Você faz parte de uma turma real e fala em tempo real com o professor. Discussão de incidentes e ameaças reais com professores que atuam na área, em aula ao vivo.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 7;height:460px;border-radius:10px;flex-direction:column;gap:6px&quot;&gt;&lt;span style=&quot;font-size:14px&quot;&gt;[VÍDEO · TRECHO REAL DE AULA · 60–90s]&lt;/span&gt;&lt;span style=&quot;font-size:11px&quot;&gt;usar o vídeo da página &quot;Como funciona&quot; ou gravar um trecho de aula de um dos MBAs&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 5;display:grid;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Dias e horário&lt;/div&gt;&lt;div style=&quot;font-size:20px;font-weight:700&quot;&gt;Seg e Qua ou Ter e Qui · 20h às 22h&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;64 aulas ao vivo em 1 ano, com calendário entregue no início&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Interação em tempo real&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Aulas pelo Zoom integradas ao Infnet Online. Travou no código? A dúvida é resolvida durante a aula.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Prática com desafios reais&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Labs virtuais e 8 projetos com desafios reais, um por disciplina, que formam o seu portfólio.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Perdeu uma aula?&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;As gravações ficam no Infnet Online para você rever quantas vezes quiser.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;carreiras&quot;&gt;&lt;div class=&quot;tag&quot;&gt;03 · A área e as carreiras&lt;/div&gt;&lt;h2&gt;O que faz quem trabalha com cibersegurança e segurança da informação&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Proteger sistemas e organizações exige duas frentes: a técnica (monitorar ameaças, investigar incidentes, simular ataques) e a de gestão (governança, riscos, continuidade, privacidade e compliance). Cada MBA aprofunda uma delas.&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Cargos&lt;/div&gt;&lt;ul style=&quot;margin:0;padding-left:20px;line-height:1.7&quot;&gt;&lt;li&gt;Engenheiro(a) de Cibersegurança&lt;/li&gt;&lt;li&gt;Analista de Segurança (Blue Team / SOC)&lt;/li&gt;&lt;li&gt;Especialista em Resposta a Incidentes e DFIR&lt;/li&gt;&lt;li&gt;Líder ou Especialista em GRC · Data Protection Officer (DPO)&lt;/li&gt;&lt;li&gt;CISO · Gerente ou Head de Segurança da Informação · Auditor&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Tecnologias e práticas&lt;/div&gt;&lt;span class=&quot;chip&quot;&gt;SIEM&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;SOAR&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;IDS/IPS&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Wireshark&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Threat Intelligence&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;DFIR&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Pentest&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Red Team&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Estratégia do CISO&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;CISSP&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Gestão de riscos&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;LGPD&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;color:#9fb4ff;margin-bottom:12px&quot;&gt;Preparo para certificações&lt;/div&gt;&lt;p style=&quot;line-height:1.55&quot;&gt;Engenharia de Cibersegurança: conteúdo alinhado a CompTIA Security+, CySA+, PenTest+, SC-200, BTL1, CEH, GCIH e GCFA. Gestão de Riscos: CISSP e CRISC, além de ISO/IEC 27001 e LGPD.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px;color:#55534D&quot;&gt;Sem promessa de salário, emprego ou prazo de transição.&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;caminho&quot;&gt;&lt;div class=&quot;tag&quot;&gt;04 · Qual caminho é para você? (interativo)&lt;/div&gt;&lt;h2&gt;Qual caminho é para você?&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Escolha o que mais parece com o seu momento.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div style=&quot;grid-column:span 5&quot;&gt;&lt;button class=&quot;opt on&quot; data-i=&quot;0&quot;&gt;&lt;b&gt;Tenho base em SO, redes e programação&lt;/b&gt;&lt;span&gt;Quero SOC, DFIR, pentest ou Red Team&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;1&quot;&gt;&lt;b&gt;Tenho experiência em TI, segurança ou compliance&lt;/b&gt;&lt;span&gt;Quero liderar governança e resposta a incidentes&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;2&quot;&gt;&lt;b&gt;Venho de auditoria, risco ou jurídico&lt;/b&gt;&lt;span&gt;Quero riscos tecnológicos e proteção de dados&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;3&quot;&gt;&lt;b&gt;Meu foco é infraestrutura&lt;/b&gt;&lt;span&gt;Redes, sistemas e cloud&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 7&quot;&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;0&quot; style=&quot;padding:32px;display:block&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Engenharia de Cibersegurança&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Detecte, investigue, responda e simule ataques: Threat Intelligence, SOC/Blue Team, DFIR, Pentest e Red Team, com SIEM, SOAR e IA.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: sistemas operacionais (linha de comando), redes e programação · Ter e Qui&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Seu perfil é de gestão e governança? Veja Gestão de Riscos e Compliance.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;1&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Gestão de Riscos, Compliance e Segurança da Informação&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Lidere governança, continuidade, privacidade e resposta a incidentes: estratégia do CISO, riscos, ransomware, gestão de crises, LGPD e compliance.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: graduação e experiência em tecnologia, segurança, governança, riscos ou compliance · Seg e Qua&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;2&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Gestão de Riscos, Compliance e Segurança da Informação&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;O MBA é aberto a quem vem de auditoria, risco, compliance, jurídico ou governança e quer fortalecer a atuação em riscos tecnológicos, privacidade e resiliência.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Estratégia do CISO · CISSP · LGPD · Seg e Qua&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;3&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Hub Redes, Infraestrutura e Cloud&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Se você quer projetar e operar a infraestrutura das empresas, veja os MBAs do Hub de Redes, Infraestrutura e Cloud.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Engenharia de Redes de Computadores · Engenharia de Cloud Computing&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#&quot;&gt;Ver o Hub&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;comparador&quot;&gt;&lt;div class=&quot;tag&quot;&gt;05 · Comparador&lt;/div&gt;&lt;h2&gt;Compare os 2 MBAs Live lado a lado&lt;/h2&gt;&lt;div class=&quot;band&quot;&gt;&lt;span&gt;Em todos os 2: 1 ano&lt;/span&gt;&lt;span&gt;20h às 22h (aulas ao vivo)&lt;/span&gt;&lt;span&gt;64 aulas ao vivo · 8 projetos com desafios reais&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cmp&quot; style=&quot;grid-template-columns:170px repeat(2,1fr)&quot;&gt;&lt;div class=&quot;rh&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#F2F1EC;line-height:1.4&quot;&gt;MBA em Engenharia de Cibersegurança&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#F2F1EC;line-height:1.4&quot;&gt;MBA em Gestão de Riscos, Compliance e Segurança da Informação&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Se você quer&lt;/div&gt;&lt;div&gt;Atuar na linha de frente das operações de segurança&lt;/div&gt;&lt;div&gt;Liderar a segurança pelo lado da gestão e da governança&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Para quem é&lt;/div&gt;&lt;div&gt;Profissionais de infraestrutura, redes, cloud e segurança rumo às operações de segurança&lt;/div&gt;&lt;div&gt;Profissionais de TI e segurança, e de auditoria, risco, compliance ou jurídico&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Pré-requisitos&lt;/div&gt;&lt;div&gt;Conhecimentos prévios em sistemas operacionais (incluindo linha de comando), redes e fundamentos de programação&lt;/div&gt;&lt;div&gt;Graduação, com experiência prévia em tecnologia, segurança da informação, governança, riscos, compliance ou áreas correlatas&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Principais tecnologias&lt;/div&gt;&lt;div&gt;IDS/IPS · SIEM · SOAR · Wireshark · Pentest · Red Team · forense digital&lt;/div&gt;&lt;div&gt;Estratégia do CISO · CISSP · gestão de riscos · ransomware · gestão de crises · privacidade e LGPD&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Cargo-alvo&lt;/div&gt;&lt;div&gt;Engenheiro(a) de Cibersegurança; Analista de Segurança (Blue Team / SOC); Especialista em Resposta a Incidentes e DFIR&lt;/div&gt;&lt;div&gt;Chief Information Security Officer (CISO); Líder ou Especialista em GRC; Data Protection Officer (DPO); Gerente ou Head de Segurança da Informação; Auditor de Segurança da Informação ou Compliance&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Dias das aulas&lt;/div&gt;&lt;div&gt;Ter e Qui, 20h00 às 22h00&lt;/div&gt;&lt;div&gt;Seg e Qua, 20h00 às 22h00&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-graduacao-mba-engenharia-ciberseguranca-ead/&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-pos-graduacao-em-seguranca-da-informacao/&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px;color:#55534D&quot;&gt;Sem preço nesta tabela: valores e condições ficam na página de cada MBA e com o consultor.&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;live&quot;&gt;&lt;div class=&quot;tag&quot;&gt;06 · MBA Live x pós EAD gravada&lt;/div&gt;&lt;h2&gt;Por que uma pós ao vivo, e não gravada&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;color:#55534D;margin-bottom:10px&quot;&gt;Pós EAD gravada&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;color:#55534D&quot;&gt;Videoaula pronta, gravada há anos&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Travou no código? Pergunta no fórum e espera&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Prova online ou TCC no final do curso&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Estudo sozinho, sem turma&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;margin-bottom:10px&quot;&gt;MBA Live Infnet&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;&quot;&gt;64 aulas 100% ao vivo, com grade atualizada pelo mercado&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Dúvida de código resolvida na hora com o professor&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;8 projetos práticos que viram portfólio&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Turma, comunidade online e Central de Carreiras com convênio com mais de 675 empresas&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;prova&quot;&gt;&lt;div class=&quot;tag&quot;&gt;07 · Prova de valor&lt;/div&gt;&lt;h2&gt;Quem ensina e quem já passou por aqui&lt;/h2&gt;&lt;h3 style=&quot;margin-top:16px&quot;&gt;Coordenação com quem atua em cibersegurança e segurança da informação no mercado&lt;/h3&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(2,1fr);gap:24px&quot;&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Paulo Tostes&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Doutor em Informática pela UFRJ · PMP · no Infnet desde 2010&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Engenharia de Cibersegurança; Gestão de Riscos, Compliance e Segurança da Informação&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;border:1px dashed #8A877F;border-radius:10px;padding:24px;display:flex;flex-direction:column;justify-content:center&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:18px;line-height:1.35&quot;&gt;Professores que atuam em grandes empresas, como Microsoft, Globo, Itaú e Vivo&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:10px&quot;&gt;Quadro permanente do Infnet e especialistas convidados por disciplina&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:8px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px&quot;&gt;&lt;h3 style=&quot;font-size:22px;margin-bottom:16px&quot;&gt;8 projetos por MBA, direto para o portfólio&lt;/h3&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;Cibersegurança: detecção e resposta a incidentes com SIEM e SOAR&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;Gestão de Riscos: plano de resposta a ransomware e gestão de crise&lt;/div&gt;&lt;div style=&quot;font-size:12px;color:#55534D;margin-top:14px&quot;&gt;Exemplos derivados das competências das grades · validar com a coordenação&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;Atuo no mercado de TI há mais de 20 anos. Ao decidir expandir os negócios de nossa consultoria para serviços especializados em segurança da informação, não tive dúvidas em escolher o Infnet. As instalações superaram minhas expectativas e os professores não são apenas docentes, mas também profissionais de mercado. Isso nos permite aliar o conhecimento teórico à prática cotidiana.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;George Chaves&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Gestão de Riscos, Compliance e Segurança da Informação&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;Excelente conteúdo e com corpo docente incrível que agregou muito em conhecimento prático e teórico na minha carreira, além disso, um networking excepcional. Recomendo este MBA para todos os profissionais de TI e Segurança da Informação, sem dúvida.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;Alexandre Procaci&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Gestão de Riscos, Compliance e Segurança da Informação&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-top:8px&quot;&gt;Preparo para certificações&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:6px&quot;&gt;MBA em Engenharia de Cibersegurança&lt;/div&gt;&lt;p style=&quot;font-size:15px;color:#3A3935&quot;&gt;CompTIA Security+, CySA+, PenTest+, SC-200, BTL1, CEH, GCIH e GCFA&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:6px&quot;&gt;MBA em Gestão de Riscos, Compliance e Segurança da Informação&lt;/div&gt;&lt;p style=&quot;font-size:15px;color:#3A3935&quot;&gt;CISSP e CRISC, além de ISO/IEC 27001 e LGPD&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;relacionados&quot;&gt;&lt;div class=&quot;tag&quot;&gt;08 · Caminhos relacionados&lt;/div&gt;&lt;h2&gt;Segurança também se conecta a infraestrutura e gestão&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB REDES, INFRAESTRUTURA E CLOUD&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Redes, Infraestrutura e Cloud&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer projetar e operar a infraestrutura das empresas →&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB GESTÃO DE TI E PROJETOS&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Gestão de TI, Projetos e Sistemas&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer liderar a área de TI, projetos e processos →&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;consultor&quot;&gt;&lt;div class=&quot;tag&quot;&gt;09 · Dúvidas e fale com um consultor&lt;/div&gt;&lt;div&gt;&lt;h2 style=&quot;margin-bottom:24px&quot;&gt;Dúvidas de quem está comparando&lt;/h2&gt;&lt;details open&gt;&lt;summary&gt;As aulas são ao vivo?&lt;/summary&gt;&lt;p&gt;Segundo o documento de diferenciais do Infnet, todas as aulas são 100% ao vivo, síncronas, com data e hora para acontecer; não é um modelo híbrido nem &amp;#x27;a maioria das aulas&amp;#x27;.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual a diferença entre os dois MBAs de segurança?&lt;/summary&gt;&lt;p&gt;Engenharia de Cibersegurança é técnico: detecção, resposta, forense, pentest e Red Team, com SIEM, SOAR e IA. Gestão de Riscos, Compliance e Segurança da Informação é de gestão: estratégia do CISO, riscos, ransomware, gestão de crises, privacidade, LGPD e compliance.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Preciso de experiência prévia?&lt;/summary&gt;&lt;p&gt;Engenharia de Cibersegurança pede conhecimentos em sistemas operacionais, redes e programação. Gestão de Riscos pede graduação e experiência em tecnologia, segurança, governança, riscos ou compliance.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual a duração e quando começa a próxima turma?&lt;/summary&gt;&lt;p&gt;Os dois têm 1 ano, com aulas das 20h00 às 22h00. Cibersegurança: 02/02/2027 (ter e qui). Gestão de Riscos: 01/02/2027 (seg e qua).&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;O diploma é reconhecido pelo MEC?&lt;/summary&gt;&lt;p&gt;Sim. O Infnet tem nota máxima (5) no credenciamento do MEC para o ensino a distância, e o diploma de MBA é de pós-graduação lato sensu, igual ao da presencial .&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Quais são as formas de pagamento?&lt;/summary&gt;&lt;p&gt;Valores e condições são apresentados pelos consultores ou no atendimento inteligente; não aparecem no Hub [regra do projeto: preço fica na LP e com o consultor].&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;div style=&quot;border:2px dashed #1f3fae;border-radius:12px;padding:12px 12px 32px;background:#F2F1EC&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;padding:4px 12px 14px&quot;&gt;[Espaço reservado · incluir aqui o bot de CTA · o formulário abaixo é a referência do que o bot deve coletar]&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;max-width:640px;margin:0 auto;padding:32px&quot;&gt;&lt;h2 style=&quot;font-size:28px;margin-bottom:8px&quot;&gt;Em dúvida entre o lado técnico e o de gestão em segurança? Converse com um consultor e veja como é a aula ao vivo.&lt;/h2&gt;&lt;p style=&quot;color:#55534D;margin-bottom:20px&quot;&gt;Conte seu momento de carreira e a base que você já tem. O consultor indica o caminho mais adequado.&lt;/p&gt;&lt;label&gt;Nome&lt;/label&gt;&lt;input placeholder=&quot;Seu nome&quot;&gt;&lt;label&gt;E-mail&lt;/label&gt;&lt;input placeholder=&quot;seu@email.com&quot;&gt;&lt;label&gt;WhatsApp&lt;/label&gt;&lt;input placeholder=&quot;(00) 00000-0000&quot;&gt;&lt;label&gt;Interesse&lt;/label&gt;&lt;select&gt;&lt;option&gt;Selecione o MBA&lt;/option&gt;&lt;option&gt;MBA em Engenharia de Cibersegurança&lt;/option&gt;&lt;option&gt;MBA em Gestão de Riscos, Compliance e Segurança da Informação&lt;/option&gt;&lt;option&gt;Ainda não sei&lt;/option&gt;&lt;/select&gt;&lt;button class=&quot;btn dark&quot; style=&quot;width:100%;justify-content:center&quot;&gt;Quero falar com um consultor&lt;/button&gt;&lt;p style=&quot;font-size:13px;color:#55534D;margin-top:12px&quot;&gt;Atendimento inteligente pela Íris, a qualquer hora; depois, um consultor entra em contato. &lt;span class=&quot;todo&quot;&gt;[Conteúdo a criar: texto de privacidade e LGPD, a definir com o jurídico]&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;footer&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px;background-color:#333;color:#aaa&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;div style=&quot;display:flex;gap:28px&quot;&gt;&lt;span&gt;Política de privacidade&lt;/span&gt;&lt;span&gt;Faculdade Infnet&lt;/span&gt;&lt;span&gt;Contato&lt;/span&gt;&lt;/div&gt;&lt;/footer&gt;&lt;/div&gt;&lt;script&gt;document.querySelectorAll(&quot;.opt&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){var i=b.dataset.i;document.querySelectorAll(&quot;.opt&quot;).forEach(function(x){x.classList.toggle(&quot;on&quot;,x===b)});document.querySelectorAll(&quot;.rec&quot;).forEach(function(c){c.style.display=c.dataset.i===i?&quot;block&quot;:&quot;none&quot;})})})&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section><section class="hub" id="H08"><iframe title="H08" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;pt-BR&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=1440&quot;&gt;&lt;title&gt;Gestão de TI, Projetos e Sistemas | Faculdade Infnet&lt;/title&gt;&lt;link href=&quot;https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;&lt;style&gt;

&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;details class=&quot;prod&quot;&gt;&lt;summary&gt;Notas de produção deste Hub&lt;/summary&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;SEO:&lt;/b&gt; title: MBAs em Engenharia de Software | Faculdade Infnet · meta: Compare os MBAs em Engenharia de Software da Faculdade Infnet: Java, .NET, IA Agêntica e Arquitetura de Software. Aulas 100% ao vivo, para quem já desenvolve software. · URL: /ead/hubs/engenharia-de-software/ [validar no Webflow] · keywords: engenharia de software; mba engenharia de software; pós-graduação engenharia de software&lt;/li&gt;&lt;li&gt;Mapa das Hubs: este Hub reúne PGLLJA, PGLLNE, PGLLSP e PGLLAR (Arquitetura de Software passa a ser o quarto curso e deixa o H06).&lt;/li&gt;&lt;li&gt;Nome do MBA de IA Agêntica: apenas o nome mudou. O copy usa o nome atual (MBA em Engenharia de Software com IA Agêntica) e o conteúdo do CSV &amp;#x27;Spec-Driven&amp;#x27;.&lt;/li&gt;&lt;li&gt;A LP do PGLLSP está em rascunho no Webflow: não ativar o Hub com link para ela antes de publicar.&lt;/li&gt;&lt;li&gt;O Hub HESI já publicado (Engenharia de Software com IA) tem outro uso e coexiste com este.&lt;/li&gt;&lt;li&gt;Buscas por &amp;#x27;java&amp;#x27; e &amp;#x27;.net&amp;#x27; devem ir direto às LPs (regra de canibalização do agente.md).&lt;/li&gt;&lt;li&gt;Formato do wireframe antigo (9 blocos). Em amarelo: [confirmar] ou [Conteúdo a criar]. Placeholders hachurados: imagens, ícones e fotos a cargo da equipe de criação. Preço fora do Hub.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;div class=&quot;page&quot;&gt;&lt;header&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;nav&gt;&lt;span&gt;Como funciona&lt;/span&gt;&lt;span&gt;Carreiras&lt;/span&gt;&lt;span&gt;Comparar MBAs&lt;/span&gt;&lt;span&gt;Professores e alunos&lt;/span&gt;&lt;span&gt;Dúvidas&lt;/span&gt;&lt;/nav&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/header&gt;&lt;section id=&quot;topo&quot;&gt;&lt;div class=&quot;grid12&quot;&gt;&lt;div style=&quot;grid-column:span 7;display:flex;flex-direction:column;gap:24px&quot;&gt;&lt;span class=&quot;tag&quot;&gt;HUB ENGENHARIA DE SOFTWARE · MBAs Live em Gestão e Engenharias Tech · EAD nota máxima (5) no MEC, com todas as aulas ao vivo&lt;/span&gt;&lt;h1&gt;MBAs em Engenharia de Software&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;&lt;b&gt;Você já escreve código, e a IA já escreve parte dele. Aprofunde uma stack, conduza agentes de IA ou evolua para arquiteto.&lt;/b&gt;&lt;/p&gt;&lt;p class=&quot;lead&quot;&gt;Quatro MBAs Live para quem já desenvolve software e quer ir além de escrever código. Usar IA na rotina já é o esperado; o que diferencia é definir o problema, revisar o que ela produz e decidir a arquitetura. Compare Java, .NET, IA Agêntica e Arquitetura de Software, veja o pré-requisito de cada um e escolha o caminho que combina com a sua base.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:16px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#comparador&quot;&gt;Comparar os MBAs Live&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 5;height:420px;border-radius:10px&quot;&gt;[IMAGEM · dev com código na tela durante a aula ao vivo, à noite, em casa · evitar tela com código genérico de banco de imagens]&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:20px&quot;&gt;Os MBAs Live desta área&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#55534D&quot;&gt;4 formações · 3 caminhos · todas com duração de 1 ano&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);column-gap:32px;row-gap:12px;grid-template-rows:auto 1fr&quot;&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 1 · Aprofundar numa stack&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para quem já programa e quer ir além do código&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;display:flex;gap:18px;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:64px;height:64px;flex:none;border-radius:8px;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia de Software com Java&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Projete e evolua sistemas Java escaláveis para ambientes corporativos.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-live-engenharia-de-software-java&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;display:flex;gap:18px;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:64px;height:64px;flex:none;border-radius:8px;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia de Software com .NET&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Evolua da implementação para a engenharia de software em .NET.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-engenharia-de-software-net&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 2 · Conduzir o desenvolvimento com agentes de IA&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para devs que querem especificar, orquestrar e validar o trabalho dos agentes&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia de Software com IA Agêntica&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Aprenda a conduzir o desenvolvimento com agentes de IA.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-engenharia-de-software-ia-agentica&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 3 · Evoluir para arquiteto de software&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para devs experientes que querem liderar decisões técnicas&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Arquitetura de Software: Cloud, Dados e IA&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Torne-se referência em decisões de arquitetura.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-arquitetura-de-software/&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;num&quot;&gt;&lt;div&gt;&lt;b&gt;30 anos&lt;/b&gt;&lt;span&gt;especializada em tecnologia, desde 1994&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Live desde 2014&lt;/b&gt;&lt;span&gt;100% das aulas ao vivo&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;30 mil+&lt;/b&gt;&lt;span&gt;alunos formados em todo o Brasil&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Nota máxima (5)&lt;/b&gt;&lt;span&gt;no credenciamento EAD do MEC&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;section id=&quot;como&quot;&gt;&lt;div class=&quot;tag&quot;&gt;02 · Como funciona o MBA Live&lt;/div&gt;&lt;h2 style=&quot;max-width:760px&quot;&gt;Aula ao vivo de verdade, não videoaula gravada anos atrás&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;max-width:800px;font-size:18px&quot;&gt;Você faz parte de uma turma real e fala em tempo real com o professor. Dúvida de código, de arquitetura ou de especificação resolvida na hora, com o professor e a turma.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 7;height:460px;border-radius:10px;flex-direction:column;gap:6px&quot;&gt;&lt;span style=&quot;font-size:14px&quot;&gt;[VÍDEO · TRECHO REAL DE AULA · 60–90s]&lt;/span&gt;&lt;span style=&quot;font-size:11px&quot;&gt;usar o vídeo da página &quot;Como funciona&quot; ou gravar um trecho de aula de um dos MBAs&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 5;display:grid;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Dias e horário&lt;/div&gt;&lt;div style=&quot;font-size:20px;font-weight:700&quot;&gt;Seg e Qua ou Ter e Qui · 20h às 22h&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;64 aulas ao vivo em 1 ano, com calendário entregue no início&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Interação em tempo real&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Aulas pelo Zoom integradas ao Infnet Online. Travou no código? A dúvida é resolvida durante a aula.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Prática com desafios reais&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Labs virtuais e 8 projetos com desafios reais, um por disciplina, que formam o seu portfólio.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Perdeu uma aula?&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;As gravações ficam no Infnet Online para você rever quantas vezes quiser.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;carreiras&quot;&gt;&lt;div class=&quot;tag&quot;&gt;03 · A área e as carreiras&lt;/div&gt;&lt;h2&gt;O que faz quem trabalha com engenharia de software&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Engenharia de software vai além de escrever código: é modelar o domínio, decidir a arquitetura, garantir qualidade e colocar em produção de forma contínua. Os quatro MBAs seguem esse caminho por rotas diferentes: Java e .NET aprofundam a engenharia numa stack corporativa; IA Agêntica ensina a especificar, orquestrar e validar o trabalho de agentes de IA, em qualquer tecnologia; Arquitetura de Software é o passo seguinte para quem já tem experiência sólida e quer decidir sobre sistemas distribuídos, cloud, dados e IA. Com a IA acelerando a escrita de código, o que as empresas valorizam é quem entende, revisa e corrige o que ela gera, define o problema e garante qualidade e segurança.&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Cargos&lt;/div&gt;&lt;ul style=&quot;margin:0;padding-left:20px;line-height:1.7&quot;&gt;&lt;li&gt;Engenheiro(a) de Software (Java, .NET)&lt;/li&gt;&lt;li&gt;Desenvolvedor(a) Full Stack ou Back-end&lt;/li&gt;&lt;li&gt;Tech Lead de Back-end · de Desenvolvimento Agêntico&lt;/li&gt;&lt;li&gt;Engenheiro(a) de IA · Engenheiro(a) de Software AI-Native · Quality Engineer&lt;/li&gt;&lt;li&gt;Arquiteto(a) de Software · Solutions / Cloud Architect · Engineering Manager&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Tecnologias e práticas&lt;/div&gt;&lt;span class=&quot;chip&quot;&gt;Java · Spring Boot&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;C# · ASP.NET&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Entity Framework&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;DDD&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Microsserviços&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;CI/CD · TDD&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Azure · AWS&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Spec-Driven Development&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Claude Code&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Skills, hooks e subagentes&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;MCP&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Playwright · GitHub Actions&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;C4 · eventos · serverless&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;color:#9fb4ff;margin-bottom:12px&quot;&gt;IA no desenvolvimento&lt;/div&gt;&lt;p style=&quot;line-height:1.55&quot;&gt;Em IA Agêntica, a IA é o método: especificar, orquestrar e validar o trabalho dos agentes. Em Arquitetura, há uma disciplina inteira de sistemas agênticos. Em Java e .NET, a IA acelera o código e a engenharia vira o diferencial.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px;color:#55534D&quot;&gt;Sem promessa de salário, emprego ou prazo de transição.&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;caminho&quot;&gt;&lt;div class=&quot;tag&quot;&gt;04 · Qual caminho é para você? (interativo)&lt;/div&gt;&lt;h2&gt;Qual caminho é para você?&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Escolha o que mais parece com o seu momento.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div style=&quot;grid-column:span 5&quot;&gt;&lt;button class=&quot;opt on&quot; data-i=&quot;0&quot;&gt;&lt;b&gt;Venho de outra área de TI&lt;/b&gt;&lt;span&gt;Ainda sem base de programação&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;1&quot;&gt;&lt;b&gt;Já programo e quero me aprofundar&lt;/b&gt;&lt;span&gt;Busco domínio numa stack&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;2&quot;&gt;&lt;b&gt;Quero conduzir o trabalho dos agentes de IA&lt;/b&gt;&lt;span&gt;Do spec à produção, em qualquer stack&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;3&quot;&gt;&lt;b&gt;Quero subir de nível ou liderar&lt;/b&gt;&lt;span&gt;Arquiteto(a), tech lead&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 7&quot;&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;0&quot; style=&quot;padding:32px;display:block&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Comece pelo Hub de Desenvolvimento de Sistemas, Web e Mobile&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Os MBAs de engenharia de software pedem experiência em desenvolvimento. Se você ainda não programa, fale com um consultor para montar o melhor caminho.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito comum: experiência em desenvolvimento e lógica de programação&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;1&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Engenharia de Software com Java ou com .NET&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Escolha pela stack. Os dois levam você além do código, com DDD, clean code, padrões de projeto, métodos ágeis e DevOps, do domínio ao deploy.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Java: Spring Boot, JPA e microsserviços · Seg e Qua · .NET: C#, ASP.NET, Azure e AWS · Seg e Qua&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar Java e .NET&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Prefere conduzir agentes de IA no desenvolvimento? Veja o MBA com IA Agêntica.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;2&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Engenharia de Software com IA Agêntica&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Aprenda a especificar, orquestrar e validar o trabalho de agentes de IA: Spec-Driven Development, Claude Code, skills, subagentes e MCP, com testes, evals e DevSecOps.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Spec-Driven · Claude Code · MCP · Playwright · GitHub Actions · Ter e Qui&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Pré-requisito: experiência em desenvolvimento, uma linguagem de programação, Git e APIs.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;3&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Arquitetura de Software: Cloud, Dados e IA&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Para quem já tem experiência sólida, domina APIs e modelagem e quer decidir sobre sistemas distribuídos, DDD, microsserviços, eventos, cloud-native e dados. O MBA não aborda fundamentos de programação.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;C4 · DDD · eventos · streaming · serverless · Ter e Qui&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Ainda precisa consolidar a stack? Veja Java ou .NET.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;comparador&quot;&gt;&lt;div class=&quot;tag&quot;&gt;05 · Comparador&lt;/div&gt;&lt;h2&gt;Compare os 4 MBAs Live lado a lado&lt;/h2&gt;&lt;div class=&quot;band&quot;&gt;&lt;span&gt;Em todos os 4: 1 ano&lt;/span&gt;&lt;span&gt;20h às 22h (aulas ao vivo)&lt;/span&gt;&lt;span&gt;64 aulas ao vivo · 8 projetos com desafios reais&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cmp&quot; style=&quot;grid-template-columns:170px repeat(4,1fr)&quot;&gt;&lt;div class=&quot;rh&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#F2F1EC;line-height:1.4&quot;&gt;MBA em Engenharia de Software com Java&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#F2F1EC;line-height:1.4&quot;&gt;MBA em Engenharia de Software com .NET&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#F2F1EC;line-height:1.4&quot;&gt;MBA em Engenharia de Software com IA Agêntica&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#F2F1EC;line-height:1.4&quot;&gt;MBA em Arquitetura de Software: Cloud, Dados e IA&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Se você quer&lt;/div&gt;&lt;div&gt;Projetar sistemas corporativos escaláveis em Java&lt;/div&gt;&lt;div&gt;Evoluir de desenvolvedor .NET para engenheiro de software&lt;/div&gt;&lt;div&gt;Conduzir agentes de IA do spec à produção, em qualquer stack&lt;/div&gt;&lt;div&gt;Evoluir de desenvolvedor para arquiteto ou tech lead&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Para quem é&lt;/div&gt;&lt;div&gt;Devs que já atuam com Java ou back-end&lt;/div&gt;&lt;div&gt;Devs que querem evoluir com .NET e C#&lt;/div&gt;&lt;div&gt;Devs, tech leads e arquitetos que querem conduzir o desenvolvimento com agentes de IA&lt;/div&gt;&lt;div&gt;Devs experientes, tech leads e arquitetos&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Pré-requisitos&lt;/div&gt;&lt;div&gt;Experiência em desenvolvimento de software; domínio de lógica de programação e orientação a objetos&lt;/div&gt;&lt;div&gt;Conhecimento de programação orientada a objetos e interesse em codificar em C#&lt;/div&gt;&lt;div&gt;Experiência prática em desenvolvimento de software; uma linguagem de programação (Python, JavaScript/TypeScript ou Java são as mais indicadas); familiaridade com Git e APIs; inglês técnico de leitura recomendado&lt;/div&gt;&lt;div&gt;Experiência sólida em desenvolvimento de software, com domínio de APIs e modelagem; o MBA não aborda fundamentos de programação&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Principais tecnologias&lt;/div&gt;&lt;div&gt;Java · Spring Boot · microsserviços · DDD · React · CI/CD · TDD&lt;/div&gt;&lt;div&gt;C# · ASP.NET · Entity Framework · DDD · AWS · Azure · DevOps&lt;/div&gt;&lt;div&gt;Spec-Driven Development · Claude Code · skills, hooks e subagentes · MCP · RAG e memória · Playwright · GitHub Actions&lt;/div&gt;&lt;div&gt;Modelo C4 · DDD · microsserviços e eventos · streaming · cloud-native e serverless · DevOps e engenharia de plataformas&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Cargo-alvo&lt;/div&gt;&lt;div&gt;Engenheiro(a) de Software; Desenvolvedor(a) Full Stack; Tech Lead de Back-end; Arquiteto(a) de Software&lt;/div&gt;&lt;div&gt;Engenheiro(a) de Software (.NET / C#); Desenvolvedor(a) Back-End Sênior (.NET); Arquiteto(a) de Software; Tech Lead / Líder Técnico&lt;/div&gt;&lt;div&gt;Engenheiro(a) de IA (AI Engineer); Engenheiro(a) de Software AI-Native; Arquiteto(a) de Software com IA; Tech Lead de Desenvolvimento Agêntico; Quality Engineer / Engenheiro(a) de Evals&lt;/div&gt;&lt;div&gt;Arquiteto(a) de Software; Solutions Architect / Cloud Architect; Tech Lead / Engineering Manager; Arquiteto(a) de Dados / Data Platform Architect&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Dias das aulas&lt;/div&gt;&lt;div&gt;Seg e Qua, 20h00 às 22h00&lt;/div&gt;&lt;div&gt;Seg e Qua, 20h00 às 22h00&lt;/div&gt;&lt;div&gt;Ter e Qui, 20h00 às 22h00&lt;/div&gt;&lt;div&gt;Ter e Qui, 20h00 às 22h00&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-live-engenharia-de-software-java&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-engenharia-de-software-net&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-engenharia-de-software-ia-agentica&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-arquitetura-de-software/&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px;color:#55534D&quot;&gt;Sem preço nesta tabela: valores e condições ficam na página de cada MBA e com o consultor.&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;live&quot;&gt;&lt;div class=&quot;tag&quot;&gt;06 · MBA Live x pós EAD gravada&lt;/div&gt;&lt;h2&gt;Por que uma pós ao vivo, e não gravada&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;color:#55534D;margin-bottom:10px&quot;&gt;Pós EAD gravada&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;color:#55534D&quot;&gt;Videoaula pronta, gravada há anos&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Travou no código? Pergunta no fórum e espera&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Prova online ou TCC no final do curso&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Estudo sozinho, sem turma&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;margin-bottom:10px&quot;&gt;MBA Live Infnet&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;&quot;&gt;64 aulas 100% ao vivo, com grade atualizada pelo mercado&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Dúvida de código resolvida na hora com o professor&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;8 projetos práticos que viram portfólio&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Turma, comunidade online e Central de Carreiras com convênio com mais de 675 empresas&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;prova&quot;&gt;&lt;div class=&quot;tag&quot;&gt;07 · Prova de valor&lt;/div&gt;&lt;h2&gt;Quem ensina e quem já passou por aqui&lt;/h2&gt;&lt;h3 style=&quot;margin-top:16px&quot;&gt;Coordenação com quem atua em engenharia de software no mercado&lt;/h3&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(5,1fr);gap:24px&quot;&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Elberth Moraes&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Tech Lead na DATAPREV · 25+ anos em engenharia de software&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Engenharia de Software com Java&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Aquino Botelho&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Assessor de TI da Fundação FEMAR · 25+ anos em projetos de TI&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Engenharia de Software com .NET&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Fernando Ferreira&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Doutor em Engenharia Elétrica (COPPE/UFRJ) · cofundador da Twist Systems · 15+ anos em IA&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Engenharia de Software com IA Agêntica&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Carlos Pivotto&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Engineering Manager na VTEX · 15+ anos em arquitetura e liderança&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Arquitetura de Software: Cloud, Dados e IA&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;border:1px dashed #8A877F;border-radius:10px;padding:24px;display:flex;flex-direction:column;justify-content:center&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:18px;line-height:1.35&quot;&gt;Professores que atuam no mercado, com experiência em grandes empresas&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:10px&quot;&gt;Quadro permanente do Infnet e especialistas convidados por disciplina&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:8px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px&quot;&gt;&lt;h3 style=&quot;font-size:22px;margin-bottom:16px&quot;&gt;8 projetos por MBA, direto para o portfólio&lt;/h3&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;Java: microsserviços com Spring Boot, do domínio ao deploy&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;.NET: aplicação com ASP.NET e Entity Framework em nuvem&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;IA Agêntica: do spec à entrega com agentes, testes e evals&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;Arquitetura: sistema distribuído orientado a eventos&lt;/div&gt;&lt;div style=&quot;font-size:12px;color:#55534D;margin-top:14px&quot;&gt;Exemplos derivados das competências das grades · validar com a coordenação&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;Com professores experientes e ativos no mercado, a pós-graduação me ajudou a ter uma visão mais profissional de como funcionam os processos de Engenharia de Software. Me surpreendi com o conteúdo do curso e aprendi além do que esperava. Hoje, programo aplicações que resolvem problemas que antes precisava de soluções de terceiros. Vale destacar que os professores são, além de capacitados, grandes profissionais dentro da área de Engenharia de Software e programação de maneira geral. Excelente curso!&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;Daniel Souza&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Engenharia de Software com Java&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;Adquiri grande conhecimento sobre Java. O networking entre os professores e alunos foi muito bom e decisivo para a minha carreira. O curso deu um grande upgrade no meu currículo e hoje recebo muitas propostas de emprego. Hoje vejo que minha graduação fora do Infnet deixou a desejar e que minha decisão de cursar a pós-graduação em Engenharia de Software com Java do Infnet foi perfeita para sanar isso.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;Alex Lírio&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Engenharia de Software com Java&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-top:8px&quot;&gt;Preparo para certificações&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:6px&quot;&gt;MBA em Engenharia de Software com Java&lt;/div&gt;&lt;p style=&quot;font-size:15px;color:#3A3935&quot;&gt;Oracle Certified Professional Java SE 17 e 21 e Spring Professional; o Infnet é parceiro oficial da Oracle há mais de 20 anos, com o primeiro curso de Java do Brasil&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;relacionados&quot;&gt;&lt;div class=&quot;tag&quot;&gt;08 · Caminhos relacionados&lt;/div&gt;&lt;h2&gt;Software também se conecta a cloud, IA e dados&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB DESENVOLVIMENTO&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Desenvolvimento de Sistemas, Web e Mobile&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer construir aplicações web e mobile →&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB INTELIGÊNCIA ARTIFICIAL&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Inteligência Artificial, Agentes e Automação&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer aplicar IA, treinar modelos ou levar agentes à produção →&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB REDES, INFRAESTRUTURA E CLOUD&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Redes, Infraestrutura e Cloud&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer projetar e operar a infraestrutura das empresas →&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;consultor&quot;&gt;&lt;div class=&quot;tag&quot;&gt;09 · Dúvidas e fale com um consultor&lt;/div&gt;&lt;div&gt;&lt;h2 style=&quot;margin-bottom:24px&quot;&gt;Dúvidas de quem está comparando&lt;/h2&gt;&lt;details open&gt;&lt;summary&gt;As aulas são ao vivo?&lt;/summary&gt;&lt;p&gt;Segundo o documento de diferenciais do Infnet, todas as aulas são 100% ao vivo, síncronas, com data e hora para acontecer; não é um modelo híbrido nem &amp;#x27;a maioria das aulas&amp;#x27;.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual a diferença entre os quatro MBAs?&lt;/summary&gt;&lt;p&gt;Java e .NET aprofundam a engenharia de software numa stack específica (Spring Boot e microsserviços em Java; C#, ASP.NET e Entity Framework em .NET), com DDD, DevOps, CI/CD e TDD. O de IA Agêntica não é de uma stack: ensina Spec-Driven Development, agentic coding com Claude Code, MCP, testes, evals e DevSecOps agêntico. O de Arquitetura de Software é para desenvolvedores que querem decidir sobre sistemas distribuídos, DDD, microsserviços, eventos, cloud-native e dados, e não aborda fundamentos de programação.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Preciso saber a linguagem antes de começar?&lt;/summary&gt;&lt;p&gt;Java: experiência em desenvolvimento, lógica de programação e orientação a objetos. .NET: programação orientada a objetos e interesse em codificar em C#. IA Agêntica: experiência prática em desenvolvimento e uma linguagem (Python, JavaScript/TypeScript ou Java), além de Git e APIs. Arquitetura: experiência sólida em desenvolvimento, com domínio de APIs e modelagem.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual a duração e quando começa a próxima turma?&lt;/summary&gt;&lt;p&gt;Todos têm 1 ano, com aulas das 20h00 às 22h00. Java e .NET: 01/02/2027 (seg e qua). IA Agêntica e Arquitetura: 02/02/2027 (ter e qui).&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;O diploma é reconhecido pelo MEC?&lt;/summary&gt;&lt;p&gt;Sim. O Infnet tem nota máxima (5) no credenciamento do MEC para o ensino a distância, e o diploma de MBA é de pós-graduação lato sensu, igual ao da presencial .&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Quais são as formas de pagamento?&lt;/summary&gt;&lt;p&gt;Valores e condições são apresentados pelos consultores ou no atendimento inteligente; não aparecem no Hub [regra do projeto: preço fica na LP e com o consultor].&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;div style=&quot;border:2px dashed #1f3fae;border-radius:12px;padding:12px 12px 32px;background:#F2F1EC&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;padding:4px 12px 14px&quot;&gt;[Espaço reservado · incluir aqui o bot de CTA · o formulário abaixo é a referência do que o bot deve coletar]&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;max-width:640px;margin:0 auto;padding:32px&quot;&gt;&lt;h2 style=&quot;font-size:28px;margin-bottom:8px&quot;&gt;Em dúvida entre Java, .NET, IA Agêntica e Arquitetura? Converse com um consultor e veja como é a aula ao vivo.&lt;/h2&gt;&lt;p style=&quot;color:#55534D;margin-bottom:20px&quot;&gt;Conte seu momento de carreira e a base que você já tem. O consultor indica o caminho mais adequado.&lt;/p&gt;&lt;label&gt;Nome&lt;/label&gt;&lt;input placeholder=&quot;Seu nome&quot;&gt;&lt;label&gt;E-mail&lt;/label&gt;&lt;input placeholder=&quot;seu@email.com&quot;&gt;&lt;label&gt;WhatsApp&lt;/label&gt;&lt;input placeholder=&quot;(00) 00000-0000&quot;&gt;&lt;label&gt;Interesse&lt;/label&gt;&lt;select&gt;&lt;option&gt;Selecione o MBA&lt;/option&gt;&lt;option&gt;MBA em Engenharia de Software com Java&lt;/option&gt;&lt;option&gt;MBA em Engenharia de Software com .NET&lt;/option&gt;&lt;option&gt;MBA em Engenharia de Software com IA Agêntica&lt;/option&gt;&lt;option&gt;MBA em Arquitetura de Software: Cloud, Dados e IA&lt;/option&gt;&lt;option&gt;Ainda não sei&lt;/option&gt;&lt;/select&gt;&lt;button class=&quot;btn dark&quot; style=&quot;width:100%;justify-content:center&quot;&gt;Quero falar com um consultor&lt;/button&gt;&lt;p style=&quot;font-size:13px;color:#55534D;margin-top:12px&quot;&gt;Atendimento inteligente pela Íris, a qualquer hora; depois, um consultor entra em contato. &lt;span class=&quot;todo&quot;&gt;[Conteúdo a criar: texto de privacidade e LGPD, a definir com o jurídico]&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;footer&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px;background-color:#333;color:#aaa&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;div style=&quot;display:flex;gap:28px&quot;&gt;&lt;span&gt;Política de privacidade&lt;/span&gt;&lt;span&gt;Faculdade Infnet&lt;/span&gt;&lt;span&gt;Contato&lt;/span&gt;&lt;/div&gt;&lt;/footer&gt;&lt;/div&gt;&lt;script&gt;document.querySelectorAll(&quot;.opt&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){var i=b.dataset.i;document.querySelectorAll(&quot;.opt&quot;).forEach(function(x){x.classList.toggle(&quot;on&quot;,x===b)});document.querySelectorAll(&quot;.rec&quot;).forEach(function(c){c.style.display=c.dataset.i===i?&quot;block&quot;:&quot;none&quot;})})})&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section><section class="hub" id="H02"><iframe title="H02" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;pt-BR&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=1440&quot;&gt;&lt;title&gt;Desenvolvimento de Sistemas, Web e Mobile | Faculdade Infnet&lt;/title&gt;&lt;link href=&quot;htt &lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;details class=&quot;prod&quot;&gt;&lt;summary&gt;Notas de produção deste Hub&lt;/summary&gt;&lt;ul&gt;&lt;li&gt;&lt;b&gt;SEO:&lt;/b&gt; title: Desenvolvimento de Sistemas, Web e Mobile | Faculdade Infnet · meta: Compare os MBAs em Engenharia Front-end e Desenvolvimento Mobile e em Desenvolvimento Web Full Stack da Faculdade Infnet. Aulas 100% ao vivo. · URL: /ead/hubs/desenvolvimento-de-sistemas-web-e-mobile/ [validar no Webflow] · keywords: desenvolvimento de sistemas; pós-graduação desenvolvimento web; mba desenvolvimento de sistemas&lt;/li&gt;&lt;li&gt;Decisão de 10/11/2026: o projeto não inclui graduações; este Hub tem só os dois MBAs.&lt;/li&gt;&lt;li&gt;Buscas pelo nome do curso (ex.: &amp;#x27;mba full stack&amp;#x27;) devem ir direto à LP.&lt;/li&gt;&lt;li&gt;Formato do wireframe antigo (9 blocos). Em amarelo: [confirmar] ou [Conteúdo a criar]. Placeholders hachurados: imagens, ícones e fotos a cargo da equipe de criação. Preço fora do Hub.&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;&lt;div class=&quot;page&quot;&gt;&lt;header&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;nav&gt;&lt;span&gt;Como funciona&lt;/span&gt;&lt;span&gt;Carreiras&lt;/span&gt;&lt;span&gt;Comparar MBAs&lt;/span&gt;&lt;span&gt;Professores e alunos&lt;/span&gt;&lt;span&gt;Dúvidas&lt;/span&gt;&lt;/nav&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/header&gt;&lt;section id=&quot;topo&quot;&gt;&lt;div class=&quot;grid12&quot;&gt;&lt;div style=&quot;grid-column:span 7;display:flex;flex-direction:column;gap:24px&quot;&gt;&lt;span class=&quot;tag&quot;&gt;HUB DESENVOLVIMENTO · MBAs Live em Gestão e Engenharias Tech · EAD nota máxima (5) no MEC, com todas as aulas ao vivo&lt;/span&gt;&lt;h1&gt;MBAs em Desenvolvimento de Sistemas, Web e Mobile&lt;/h1&gt;&lt;p class=&quot;lead&quot;&gt;&lt;b&gt;Você já programa. Escolha como entregar mais: dominar interfaces e mobile, ou construir a aplicação inteira, do front-end ao back-end.&lt;/b&gt;&lt;/p&gt;&lt;p class=&quot;lead&quot;&gt;Dois MBAs Live para quem já programa e quer sair das tarefas isoladas para entregar aplicações de ponta a ponta: front-end e mobile, ou full stack. Compare os pré-requisitos e escolha pela sua base.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:16px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#comparador&quot;&gt;Comparar os MBAs Live&lt;/a&gt;&lt;a class=&quot;btn&quot; href=&quot;#consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 5;height:420px;border-radius:10px&quot;&gt;[IMAGEM · dev com projeto web e mobile na tela durante a aula ao vivo, à noite, em casa · evitar interface genérica de banco de imagens]&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:20px&quot;&gt;Os MBAs Live desta área&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#55534D&quot;&gt;2 formações · 2 caminhos · todas com duração de 1 ano&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(2,1fr);column-gap:32px;row-gap:12px;grid-template-rows:auto 1fr&quot;&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 1 · Interfaces web e aplicativos mobile&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para devs com base web que querem ampliar para mobile&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia Front-end e Desenvolvimento Mobile com IA&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Engenharia de aplicações web e mobile.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-front-end-engineering-pos-graduacao-desenvolvimento-mobile-ead/&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:12px&quot;&gt;&lt;div&gt;&lt;div class=&quot;tag&quot; style=&quot;padding-left:4px&quot;&gt;Caminho 2 · Aplicações web completas&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:4px;padding-left:4px&quot;&gt;Para quem programa e quer entregar da interface ao banco&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px;border-color:#1E1E1C;flex:1&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;height:120px;border-radius:8px;margin-bottom:16px&quot;&gt;[IMAGEM]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:20px;line-height:1.3&quot;&gt;Engenharia e Desenvolvimento Web Full Stack com IA&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#3A3935;margin:8px 0 12px;line-height:1.45&quot;&gt;Aplicações web completas.&lt;/div&gt;&lt;a href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-graduacao-desenvolvimento-web-full-stack/&quot; style=&quot;color:#1f3fae;font-weight:600;font-size:14px;text-decoration:none&quot;&gt;Ver o MBA Live →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;num&quot;&gt;&lt;div&gt;&lt;b&gt;30 anos&lt;/b&gt;&lt;span&gt;especializada em tecnologia, desde 1994&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Live desde 2014&lt;/b&gt;&lt;span&gt;100% das aulas ao vivo&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;30 mil+&lt;/b&gt;&lt;span&gt;alunos formados em todo o Brasil&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Nota máxima (5)&lt;/b&gt;&lt;span&gt;no credenciamento EAD do MEC&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;section id=&quot;como&quot;&gt;&lt;div class=&quot;tag&quot;&gt;02 · Como funciona o MBA Live&lt;/div&gt;&lt;h2 style=&quot;max-width:760px&quot;&gt;Aula ao vivo de verdade, não videoaula gravada anos atrás&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;max-width:800px;font-size:18px&quot;&gt;Você faz parte de uma turma real e fala em tempo real com o professor. Dúvida de código e de arquitetura resolvida na hora, em aula ao vivo, com o professor e a turma.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;grid-column:span 7;height:460px;border-radius:10px;flex-direction:column;gap:6px&quot;&gt;&lt;span style=&quot;font-size:14px&quot;&gt;[VÍDEO · TRECHO REAL DE AULA · 60–90s]&lt;/span&gt;&lt;span style=&quot;font-size:11px&quot;&gt;usar o vídeo da página &quot;Como funciona&quot; ou gravar um trecho de aula de um dos MBAs&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 5;display:grid;gap:16px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Dias e horário&lt;/div&gt;&lt;div style=&quot;font-size:20px;font-weight:700&quot;&gt;Seg e Qua ou Ter e Qui · 20h às 22h&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;64 aulas ao vivo em 1 ano, com calendário entregue no início&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Interação em tempo real&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Aulas pelo Zoom integradas ao Infnet Online. Travou no código? A dúvida é resolvida durante a aula.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Prática com desafios reais&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;Labs virtuais e 8 projetos com desafios reais, um por disciplina, que formam o seu portfólio.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:20px 22px&quot;&gt;&lt;div style=&quot;font-size:13px;font-weight:600;color:#55534D;margin-bottom:6px&quot;&gt;Perdeu uma aula?&lt;/div&gt;&lt;div style=&quot;font-size:16px;line-height:1.5&quot;&gt;As gravações ficam no Infnet Online para você rever quantas vezes quiser.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;carreiras&quot;&gt;&lt;div class=&quot;tag&quot;&gt;03 · A área e as carreiras&lt;/div&gt;&lt;h2&gt;O que faz quem trabalha com desenvolvimento web e mobile&lt;/h2&gt;&lt;p class=&quot;lead&quot;&gt;Desenvolver sistemas é transformar necessidades em software que funciona, do front-end ao back-end, em aplicações web e mobile. Os dois MBAs aprofundam quem já programa: um em interfaces e mobile, outro em aplicações web completas, sempre com IA no processo de desenvolvimento. Usar IA para programar já é o esperado; o que as empresas valorizam é entender, revisar e corrigir o que ela gera.&lt;/p&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Cargos&lt;/div&gt;&lt;ul style=&quot;margin:0;padding-left:20px;line-height:1.7&quot;&gt;&lt;li&gt;Engenheiro(a) de Software Front-End&lt;/li&gt;&lt;li&gt;Desenvolvedor(a) Mobile Android e iOS&lt;/li&gt;&lt;li&gt;Desenvolvedor(a) Full Stack · Engenheiro(a) Full Stack&lt;/li&gt;&lt;li&gt;Desenvolvedor(a) Front-End Sênior&lt;/li&gt;&lt;li&gt;Tech Lead · Especialista em Performance Web e Mobile&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;margin-bottom:12px&quot;&gt;Tecnologias e práticas&lt;/div&gt;&lt;span class=&quot;chip&quot;&gt;React · Next.js&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Angular&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;TypeScript&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Flutter · React Native&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;GraphQL · Firebase&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Node.js · Express&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;SQL · MongoDB&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Contêineres e deploy em nuvem&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Testes e qualidade&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;color:#9fb4ff;margin-bottom:12px&quot;&gt;IA no desenvolvimento&lt;/div&gt;&lt;p style=&quot;line-height:1.55&quot;&gt;Em Front-end e Mobile, a IA está integrada a todas as disciplinas, da pesquisa de UX ao deploy. Em Full Stack, os recursos de IA entram na construção de aplicações completas.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px;color:#55534D&quot;&gt;Sem promessa de salário, emprego ou prazo de transição.&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;caminho&quot;&gt;&lt;div class=&quot;tag&quot;&gt;04 · Qual caminho é para você? (interativo)&lt;/div&gt;&lt;h2&gt;Qual caminho é para você?&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Escolha o que mais parece com o seu momento.&lt;/p&gt;&lt;div class=&quot;grid12&quot; style=&quot;align-items:start&quot;&gt;&lt;div style=&quot;grid-column:span 5&quot;&gt;&lt;button class=&quot;opt on&quot; data-i=&quot;0&quot;&gt;&lt;b&gt;Já desenvolvo para a web&lt;/b&gt;&lt;span&gt;Quero focar em interface e mobile&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;1&quot;&gt;&lt;b&gt;Já programo&lt;/b&gt;&lt;span&gt;Quero entregar aplicações completas&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;2&quot;&gt;&lt;b&gt;Ainda não programo&lt;/b&gt;&lt;span&gt;Quero entender por onde começar&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;opt&quot; data-i=&quot;3&quot;&gt;&lt;b&gt;Quero evoluir em engenharia de software&lt;/b&gt;&lt;span&gt;Java, .NET, IA agêntica ou arquitetura&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div style=&quot;grid-column:span 7&quot;&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;0&quot; style=&quot;padding:32px;display:block&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Engenharia Front-end e Desenvolvimento Mobile com IA&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Engenharia de aplicações web e mobile: arquitetura, integração, performance, testes e entrega, com React, Next.js, Angular, Flutter, React Native e TypeScript.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: lógica, HTML, CSS, JavaScript e consumo de APIs · Seg e Qua&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os dois MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Prefere dominar a aplicação inteira? Veja o MBA Full Stack.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;1&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Engenharia e Desenvolvimento Web Full Stack com IA&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Aplicações web completas: React e Next.js, APIs com Node.js, Express e TypeScript, bancos SQL e MongoDB, autenticação, testes e deploy em nuvem.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisito: saber programar e ter experiência em front-end ou back-end · Ter e Qui&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-comparador&quot;&gt;Comparar os dois MBAs&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;p style=&quot;margin-top:16px;font-size:14px;color:#55534D&quot;&gt;Quer focar na camada de interface e nos apps? Veja Front-end e Mobile.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;2&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Converse com um consultor&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Os dois MBAs pedem base em programação. Um consultor ajuda você a montar o melhor caminho a partir do seu histórico.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Pré-requisitos: lógica, HTML, CSS e JavaScript (Front-end e Mobile) · saber programar (Full Stack)&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#sw-consultor&quot;&gt;Falar com um consultor&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card rec&quot; data-i=&quot;3&quot; style=&quot;padding:32px;display:none&quot;&gt;&lt;div class=&quot;tag&quot;&gt;Recomendado para você&lt;/div&gt;&lt;h2 style=&quot;font-size:30px;margin:16px 0 14px&quot;&gt;Hub Engenharia de Software&lt;/h2&gt;&lt;p class=&quot;lead&quot; style=&quot;font-size:18px&quot;&gt;Se você já tem experiência em desenvolvimento e quer aprofundar uma stack, conduzir agentes de IA ou chegar à arquitetura, veja os MBAs do Hub de Engenharia de Software.&lt;/p&gt;&lt;div style=&quot;margin-top:18px;background:#F2F1EC;border:1px solid #E2DFD8;border-radius:6px;padding:14px 16px;font-size:14px;color:#3A3935&quot;&gt;Java · .NET · IA Agêntica · Arquitetura de Software&lt;/div&gt;&lt;div style=&quot;display:flex;gap:20px;align-items:center;margin-top:20px&quot;&gt;&lt;a class=&quot;btn dark&quot; href=&quot;#&quot;&gt;Ver o Hub&lt;/a&gt;&lt;a href=&quot;#consultor&quot; style=&quot;color:#1f3fae;font-size:15px&quot;&gt;Prefiro conversar com um consultor&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;comparador&quot;&gt;&lt;div class=&quot;tag&quot;&gt;05 · Comparador&lt;/div&gt;&lt;h2&gt;Compare os 2 MBAs Live lado a lado&lt;/h2&gt;&lt;div class=&quot;band&quot;&gt;&lt;span&gt;Em todos os 2: 1 ano&lt;/span&gt;&lt;span&gt;20h às 22h (aulas ao vivo)&lt;/span&gt;&lt;span&gt;64 aulas ao vivo · 8 projetos com desafios reais&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cmp&quot; style=&quot;grid-template-columns:170px repeat(2,1fr)&quot;&gt;&lt;div class=&quot;rh&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#F2F1EC;line-height:1.4&quot;&gt;MBA em Engenharia Front-end e Desenvolvimento Mobile com IA&lt;/div&gt;&lt;div class=&quot;tag&quot; style=&quot;background:#F2F1EC;line-height:1.4&quot;&gt;MBA em Engenharia e Desenvolvimento Web Full Stack com IA&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Se você quer&lt;/div&gt;&lt;div&gt;Focar em interfaces web e apps mobile&lt;/div&gt;&lt;div&gt;Entregar aplicações web completas, da interface ao banco de dados&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Para quem é&lt;/div&gt;&lt;div&gt;Devs com base web que querem ampliar para mobile&lt;/div&gt;&lt;div&gt;Devs front-end ou back-end que querem atuar como full stack&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Pré-requisitos&lt;/div&gt;&lt;div&gt;Base em desenvolvimento web: lógica de programação, HTML, CSS e JavaScript, e familiaridade com interfaces e consumo de APIs&lt;/div&gt;&lt;div&gt;Saber programar e ter experiência prévia em front-end ou back-end; não exige experiência full stack&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Principais tecnologias&lt;/div&gt;&lt;div&gt;React · Next.js · Angular · TypeScript · Flutter · React Native · GraphQL · Firebase&lt;/div&gt;&lt;div&gt;React · Next.js · Node.js · Express · TypeScript · SQL · MongoDB · contêineres e deploy em nuvem&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Cargo-alvo&lt;/div&gt;&lt;div&gt;Engenheiro(a) de Software Front-End; Desenvolvedor(a) Mobile Android e iOS; Desenvolvedor(a) Front-End Sênior; Tech Lead; Especialista em Performance Web e Mobile&lt;/div&gt;&lt;div&gt;Desenvolvedor(a) Full Stack; Engenheiro(a) de Software; Engenheiro(a) Full Stack; Tech Lead&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;Dias das aulas&lt;/div&gt;&lt;div&gt;Seg e Qua, 20h00 às 22h00&lt;/div&gt;&lt;div&gt;Ter e Qui, 20h00 às 22h00&lt;/div&gt;&lt;div class=&quot;rh&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/mba-front-end-engineering-pos-graduacao-desenvolvimento-mobile-ead/&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;a class=&quot;btn dark&quot; style=&quot;padding:10px 16px;font-size:14px&quot; href=&quot;https://posgraduacao.infnet.edu.br/ead/pos-graduacao-desenvolvimento-web-full-stack/&quot;&gt;Ver o MBA →&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;p style=&quot;font-size:14px;color:#55534D&quot;&gt;Sem preço nesta tabela: valores e condições ficam na página de cada MBA e com o consultor.&lt;/p&gt;&lt;/section&gt;&lt;section id=&quot;live&quot;&gt;&lt;div class=&quot;tag&quot;&gt;06 · MBA Live x pós EAD gravada&lt;/div&gt;&lt;h2&gt;Por que uma pós ao vivo, e não gravada&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;color:#55534D;margin-bottom:10px&quot;&gt;Pós EAD gravada&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;color:#55534D&quot;&gt;Videoaula pronta, gravada há anos&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Travou no código? Pergunta no fórum e espera&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Prova online ou TCC no final do curso&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #E2DFD8;font-size:17px;color:#55534D&quot;&gt;Estudo sozinho, sem turma&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;dkc&quot; style=&quot;padding:28px 30px&quot;&gt;&lt;div style=&quot;font-weight:600;margin-bottom:10px&quot;&gt;MBA Live Infnet&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:0;font-size:17px;&quot;&gt;64 aulas 100% ao vivo, com grade atualizada pelo mercado&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Dúvida de código resolvida na hora com o professor&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;8 projetos práticos que viram portfólio&lt;/div&gt;&lt;div style=&quot;padding:14px 0;border-top:1px solid #333;font-size:17px;&quot;&gt;Turma, comunidade online e Central de Carreiras com convênio com mais de 675 empresas&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;prova&quot;&gt;&lt;div class=&quot;tag&quot;&gt;07 · Prova de valor&lt;/div&gt;&lt;h2&gt;Quem ensina e quem já passou por aqui&lt;/h2&gt;&lt;h3 style=&quot;margin-top:16px&quot;&gt;Coordenação com quem atua em desenvolvimento de sistemas, web e mobile no mercado&lt;/h3&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(2,1fr);gap:24px&quot;&gt;&lt;div&gt;&lt;div class=&quot;ph&quot; style=&quot;height:200px;border-radius:10px&quot;&gt;[FOTO]&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:18px;margin-top:14px&quot;&gt;Elberth Moraes&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#3A3935;margin-top:6px;line-height:1.45&quot;&gt;Tech Lead na DATAPREV · 25+ anos em engenharia de software&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D;margin-top:6px&quot;&gt;Coordena Engenharia Front-end e Desenvolvimento Mobile com IA; Engenharia e Desenvolvimento Web Full Stack com IA&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;border:1px dashed #8A877F;border-radius:10px;padding:24px;display:flex;flex-direction:column;justify-content:center&quot;&gt;&lt;div style=&quot;font-weight:700;font-size:18px;line-height:1.35&quot;&gt;Professores que atuam no mercado, com experiência em grandes empresas&lt;/div&gt;&lt;div style=&quot;font-size:14px;color:#55534D;margin-top:10px&quot;&gt;Quadro permanente do Infnet e especialistas convidados por disciplina&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:8px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px&quot;&gt;&lt;h3 style=&quot;font-size:22px;margin-bottom:16px&quot;&gt;8 projetos por MBA, direto para o portfólio&lt;/h3&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;Front-end e Mobile: app com Flutter ou React Native&lt;/div&gt;&lt;div class=&quot;dash&quot; style=&quot;margin-top:10px;color:#1E1E1C&quot;&gt;Full Stack: aplicação completa com React, Node.js e deploy em nuvem&lt;/div&gt;&lt;div style=&quot;font-size:12px;color:#55534D;margin-top:14px&quot;&gt;Exemplos derivados das competências das grades · validar com a coordenação&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;Se você deseja aprender de um jeito prático as tecnologias de desenvolvimento Full Stack, esta pós-graduação te atenderá. As aulas ao vivo te ajudam a entender as linguagens e a superar os desafios, e os professores são profissionais experientes que passam o conhecimento com muita clareza.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;Tamara Organ&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Engenharia e Desenvolvimento Web Full Stack com IA&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px&quot;&gt;&lt;p style=&quot;font-size:19px;line-height:1.45&quot;&gt;O curso de MBA em Desenvolvimento Web Full Stack do Infnet foi a melhor aposta da minha vida. Mesmo morando em Portugal, escolhi o Infnet porque já conhecia e sabia que era uma boa instituição. Em poucos meses fiz uma imersão em development e ao final consegui um emprego aqui em Lisboa, e ainda sou super elogiada no trabalho.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:14px;align-items:center&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:44px;height:44px;border-radius:50%;flex:none;padding:0&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;div style=&quot;font-weight:700;font-size:15px&quot;&gt;Julia Fremder&lt;/div&gt;&lt;div style=&quot;font-size:13px;color:#55534D&quot;&gt;MBA em Engenharia e Desenvolvimento Web Full Stack com IA&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;relacionados&quot;&gt;&lt;div class=&quot;tag&quot;&gt;08 · Caminhos relacionados&lt;/div&gt;&lt;h2&gt;Desenvolvimento também se conecta a engenharia de software e IA&lt;/h2&gt;&lt;div style=&quot;display:grid;grid-template-columns:repeat(3,1fr);gap:24px&quot;&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB ENGENHARIA DE SOFTWARE&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Engenharia de Software&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer aprofundar uma stack, conduzir agentes de IA ou chegar à arquitetura →&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB INTELIGÊNCIA ARTIFICIAL&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;Inteligência Artificial, Agentes e Automação&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;Para quem quer aplicar IA, treinar modelos ou levar agentes à produção →&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;padding:28px 24px&quot;&gt;&lt;div class=&quot;mono&quot; style=&quot;font-size:12px;letter-spacing:.06em;color:#55534D;text-transform:uppercase;margin-bottom:10px&quot;&gt;HUB&lt;/div&gt;&lt;div style=&quot;font-weight:700;font-size:21px;line-height:1.3&quot;&gt;MBA em Arquitetura de Software: Cloud, Dados e IA (Hub H01)&lt;/div&gt;&lt;p style=&quot;font-size:16px;color:#3A3935;margin-top:10px;line-height:1.5&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section id=&quot;consultor&quot;&gt;&lt;div class=&quot;tag&quot;&gt;09 · Dúvidas e fale com um consultor&lt;/div&gt;&lt;div&gt;&lt;h2 style=&quot;margin-bottom:24px&quot;&gt;Dúvidas de quem está comparando&lt;/h2&gt;&lt;details open&gt;&lt;summary&gt;As aulas são ao vivo?&lt;/summary&gt;&lt;p&gt;Segundo o documento de diferenciais do Infnet, todas as aulas são 100% ao vivo, síncronas, com data e hora para acontecer; não é um modelo híbrido nem &amp;#x27;a maioria das aulas&amp;#x27;.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Preciso saber programar para começar?&lt;/summary&gt;&lt;p&gt;Sim. Front-end e Mobile pede base em lógica, HTML, CSS e JavaScript. Full Stack pede saber programar e ter experiência em front-end ou back-end, mas não exige experiência full stack.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual a diferença entre os dois MBAs?&lt;/summary&gt;&lt;p&gt;Front-end e Mobile trabalha React, Next.js, Angular, Flutter, React Native e TypeScript, com arquitetura, performance e integração. Full Stack trabalha React e Next.js no front, Node.js, Express e TypeScript no back, bancos SQL e MongoDB, testes e deploy em nuvem.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qual a duração e quando começa a próxima turma?&lt;/summary&gt;&lt;p&gt;Os dois têm 1 ano, com aulas das 20h00 às 22h00. Front-end e Mobile: 01/02/2027 (seg e qua). Full Stack: 02/02/2027 (ter e qui).&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;O diploma é reconhecido pelo MEC?&lt;/summary&gt;&lt;p&gt;Sim. O Infnet tem nota máxima (5) no credenciamento do MEC para o ensino a distância, e o diploma de MBA é de pós-graduação lato sensu, igual ao da presencial .&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Quais são as formas de pagamento?&lt;/summary&gt;&lt;p&gt;Valores e condições são apresentados pelos consultores ou no atendimento inteligente; não aparecem no Hub [regra do projeto: preço fica na LP e com o consultor].&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;div style=&quot;border:2px dashed #1f3fae;border-radius:12px;padding:12px 12px 32px;background:#F2F1EC&quot;&gt;&lt;div class=&quot;tag&quot; style=&quot;padding:4px 12px 14px&quot;&gt;[Espaço reservado · incluir aqui o bot de CTA · o formulário abaixo é a referência do que o bot deve coletar]&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;max-width:640px;margin:0 auto;padding:32px&quot;&gt;&lt;h2 style=&quot;font-size:28px;margin-bottom:8px&quot;&gt;Em dúvida entre front-end e mobile ou full stack? Converse com um consultor e veja como é a aula ao vivo.&lt;/h2&gt;&lt;p style=&quot;color:#55534D;margin-bottom:20px&quot;&gt;Conte seu momento de carreira e a base que você já tem. O consultor indica o caminho mais adequado.&lt;/p&gt;&lt;label&gt;Nome&lt;/label&gt;&lt;input placeholder=&quot;Seu nome&quot;&gt;&lt;label&gt;E-mail&lt;/label&gt;&lt;input placeholder=&quot;seu@email.com&quot;&gt;&lt;label&gt;WhatsApp&lt;/label&gt;&lt;input placeholder=&quot;(00) 00000-0000&quot;&gt;&lt;label&gt;Interesse&lt;/label&gt;&lt;select&gt;&lt;option&gt;Selecione o MBA&lt;/option&gt;&lt;option&gt;MBA em Engenharia Front-end e Desenvolvimento Mobile com IA&lt;/option&gt;&lt;option&gt;MBA em Engenharia e Desenvolvimento Web Full Stack com IA&lt;/option&gt;&lt;option&gt;Ainda não sei&lt;/option&gt;&lt;/select&gt;&lt;button class=&quot;btn dark&quot; style=&quot;width:100%;justify-content:center&quot;&gt;Quero falar com um consultor&lt;/button&gt;&lt;p style=&quot;font-size:13px;color:#55534D;margin-top:12px&quot;&gt;Atendimento inteligente pela Íris, a qualquer hora; depois, um consultor entra em contato. &lt;span class=&quot;todo&quot;&gt;[Conteúdo a criar: texto de privacidade e LGPD, a definir com o jurídico]&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;footer&gt;&lt;div class=&quot;ph&quot; style=&quot;width:132px;height:36px;background-color:#333;color:#aaa&quot;&gt;[LOGO INFNET]&lt;/div&gt;&lt;div style=&quot;display:flex;gap:28px&quot;&gt;&lt;span&gt;Política de privacidade&lt;/span&gt;&lt;span&gt;Faculdade Infnet&lt;/span&gt;&lt;span&gt;Contato&lt;/span&gt;&lt;/div&gt;&lt;/footer&gt;&lt;/div&gt;&lt;script&gt;document.querySelectorAll(&quot;.opt&quot;).forEach(function(b){b.addEventListener(&quot;click&quot;,function(){var i=b.dataset.i;document.querySelectorAll(&quot;.opt&quot;).forEach(function(x){x.classList.toggle(&quot;on&quot;,x===b)});document.querySelectorAll(&quot;.rec&quot;).forEach(function(c){c.style.display=c.dataset.i===i?&quot;block&quot;:&quot;none&quot;})})})&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></section><section class="hub" id="H03"><iframe title="H03" srcdoc="&lt;!doctype html&gt;&lt;html lang=&quot;pt-BR&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=1440&quot;&gt;&lt;title&gt;Inteligência Artificial, Agentes e Automação | Faculdade Infnet&lt;/title&gt;&lt;link href=&quot;https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;&lt;style&gt;
